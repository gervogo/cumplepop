<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop — Árbitro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F5;
        --fuchsia: #FF1493;
        --yellow: #FFD700;
        --lila: #DDA0DD;
        --black: #1A1A1A;
        --white: #FFFFFF;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        background: var(--cream);
        font-family: 'Kalam', cursive;
        color: var(--black);
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .top-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 16px 24px;
        overflow: hidden;
      }

      .logo {
        width: clamp(140px, 28vw, 260px);
        height: auto;
        margin-bottom: 8px;
      }

      .sticker {
        position: absolute;
        pointer-events: none;
        opacity: 0.18;
        width: clamp(35px, 7vw, 70px);
        height: auto;
      }

      .counter {
        font-family: 'Fredoka', sans-serif;
        font-size: 0.85rem;
        opacity: 0.35;
        margin-bottom: 12px;
      }

      .question-card {
        width: 100%;
        max-width: 600px;
        background: var(--white);
        border: 3px solid var(--black);
        box-shadow: 5px 5px 0px var(--black);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 0;
      }

      .q-category {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--fuchsia);
        margin-bottom: 6px;
      }

      .q-text {
        font-weight: 700;
        font-size: 1.2rem;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      .q-answer {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        color: var(--fuchsia);
        border: 3px dashed var(--fuchsia);
        border-radius: 12px;
        padding: 8px 16px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .q-answer.visible { opacity: 1; }

      .q-meta {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        font-size: 0.8rem;
        opacity: 0.4;
      }

      .reveal-bar {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: center;
        padding: 10px 0 6px;
      }

      .bottom-bar {
        width: 100%;
        padding: 12px 16px env(safe-area-inset-bottom, 12px);
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        background: var(--cream);
        border-top: 2px solid rgba(0,0,0,0.06);
      }

      .btn {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        border: 3px solid var(--black);
        box-shadow: 3px 3px 0px var(--black);
        padding: 0.6em 1.4em;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        background: var(--white);
        color: var(--black);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px var(--black);
      }
      .btn-primary {
        background: var(--fuchsia);
        color: var(--white);
      }
      .btn-reveal {
        background: var(--yellow);
        color: var(--black);
      }
      .btn-shuffle {
        background: var(--lila);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="top-area">
      <img class="sticker" src="assets/icons-bg/icon-01.png" style="top:6%;left:5%;transform:rotate(12deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-05.png" style="top:10%;right:8%;transform:rotate(-10deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-09.png" style="bottom:20%;left:4%;transform:rotate(18deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-14.png" style="top:50%;right:4%;transform:rotate(-15deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-20.png" style="bottom:15%;right:6%;transform:rotate(22deg)" alt="">

      <img class="logo" src="assets/logo-explotado.png" alt="CumplePop">

      <div class="counter" id="questionCounter"></div>

      <div class="question-card" id="questionCard">
        <div class="q-category" id="qCategory"></div>
        <div class="q-text" id="qText"></div>
        <div class="q-answer" id="qAnswer"></div>
        <div class="q-meta">
          <span id="qType"></span>
          <span id="qDifficulty"></span>
        </div>
      </div>
    </div>

    <div class="reveal-bar">
      <button class="btn btn-reveal" id="btnReveal">Revelar respuesta</button>
      <button class="btn btn-reveal" id="btnHide" style="display:none">Ocultar respuesta</button>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="btnPrev" disabled>←</button>
      <button class="btn btn-shuffle" id="btnShuffle" title="Barajar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      </button>
      <button class="btn btn-primary" id="btnNext">→</button>
    </div>

    <script>
      const btnPrev = document.getElementById('btnPrev')
      const btnNext = document.getElementById('btnNext')
      const btnReveal = document.getElementById('btnReveal')
      const btnHide = document.getElementById('btnHide')
      const btnShuffle = document.getElementById('btnShuffle')
      const questionCounter = document.getElementById('questionCounter')
      const qCategory = document.getElementById('qCategory')
      const qText = document.getElementById('qText')
      const qAnswer = document.getElementById('qAnswer')
      const qType = document.getElementById('qType')
      const qDifficulty = document.getElementById('qDifficulty')

      let questions = []
      let currentIndex = 0
      let revealAnswer = false
      let order = []

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[a[i], a[j]] = [a[j], a[i]]
        }
        return a
      }

      fetch('data/preguntas.json')
        .then(r => r.json())
        .then(data => {
          questions = data
          order = shuffle(data.map((_, i) => i))
          renderLocal()
        })

      function renderLocal() {
        if (!order.length) return
        const qIdx = order[currentIndex]
        const q = questions[qIdx]
        if (!q) return

        questionCounter.textContent = `${currentIndex + 1} / ${order.length}`
        qCategory.textContent = q.categoria
        qText.textContent = q.pregunta
        qType.textContent = `Tipo: ${q.tipo}`
        qDifficulty.textContent = `Dificultad: ${q.dificultad}`

        if (revealAnswer) {
          qAnswer.textContent = q.respuesta
          qAnswer.classList.add('visible')
          btnReveal.style.display = 'none'
          btnHide.style.display = ''
        } else {
          qAnswer.classList.remove('visible')
          qAnswer.textContent = ''
          btnReveal.style.display = ''
          btnHide.style.display = 'none'
        }

        btnPrev.disabled = currentIndex <= 0
        btnNext.disabled = currentIndex >= order.length - 1
      }

      btnPrev.onclick = () => {
        if (currentIndex > 0) {
          currentIndex--
          revealAnswer = false
          renderLocal()
        }
      }

      btnNext.onclick = () => {
        if (currentIndex < order.length - 1) {
          currentIndex++
          revealAnswer = false
          renderLocal()
        }
      }

      btnReveal.onclick = () => {
        revealAnswer = true
        renderLocal()
      }

      btnHide.onclick = () => {
        revealAnswer = false
        renderLocal()
      }

      btnShuffle.onclick = () => {
        order = shuffle(questions.map((_, i) => i))
        currentIndex = 0
        revealAnswer = false
        renderLocal()
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault()
          btnPrev.click()
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault()
          btnNext.click()
        } else if (e.key === ' ') {
          e.preventDefault()
          if (revealAnswer) btnHide.click()
          else btnReveal.click()
        }
      })
    </script>
  </body>
</html>
