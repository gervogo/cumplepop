<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop — Árbitro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F5;
        --fuchsia: #FF1493;
        --yellow: #FFD700;
        --lila: #DDA0DD;
        --black: #1A1A1A;
        --white: #FFFFFF;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        background: var(--cream);
        font-family: 'Kalam', cursive;
        color: var(--black);
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .top-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 16px 24px;
        overflow: hidden;
      }

      .logo {
        width: clamp(140px, 28vw, 260px);
        height: auto;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
      }

      .sticker {
        position: absolute;
        pointer-events: none;
        opacity: 0.18;
        width: clamp(35px, 7vw, 70px);
        height: auto;
        z-index: 0;
      }

      .counter {
        font-family: 'Fredoka', sans-serif;
        font-size: 0.85rem;
        opacity: 0.35;
        margin-bottom: 12px;
        position: relative;
        z-index: 1;
      }

      .question-card {
        width: 100%;
        max-width: 600px;
        background: var(--white);
        border: 3px solid var(--black);
        box-shadow: 5px 5px 0px var(--black);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 0;
        position: relative;
        z-index: 1;
      }

      .q-category {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--fuchsia);
        margin-bottom: 6px;
      }

      .q-text {
        font-weight: 700;
        font-size: 1.2rem;
        line-height: 1.4;
        margin-bottom: 12px;
      }

      .q-answer {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 1.8rem;
        color: var(--fuchsia);
        border: 3px dashed var(--fuchsia);
        border-radius: 12px;
        padding: 8px 16px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .q-answer.visible { opacity: 1; }

      .q-meta {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        font-size: 0.8rem;
        opacity: 0.4;
      }

      .reveal-bar {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: center;
        padding: 10px 0 6px;
        position: relative;
        z-index: 1;
      }

      .bottom-bar {
        width: 100%;
        padding: 12px 16px env(safe-area-inset-bottom, 12px);
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        background: var(--cream);
        border-top: 2px solid rgba(0,0,0,0.06);
      }

      .btn {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        border: 3px solid var(--black);
        box-shadow: 3px 3px 0px var(--black);
        padding: 0.6em 1.4em;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        background: var(--white);
        color: var(--black);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px var(--black);
      }
      .btn-primary {
        background: var(--fuchsia);
        color: var(--white);
      }
      .btn-reveal {
        background: var(--yellow);
        color: var(--black);
      }
      .btn-shuffle {
        background: var(--lila);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* ===== CATEGORY FILTER ===== */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        padding: 8px 12px;
        max-width: 640px;
        margin: 0 auto;
      }
      .filter-chip {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 0.7rem;
        padding: 4px 12px;
        border: 2px solid var(--black);
        border-radius: 20px;
        background: var(--white);
        color: var(--black);
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
        white-space: nowrap;
      }
      .filter-chip:active {
        transform: translate(1px, 1px);
      }
      .filter-chip.active {
        background: var(--fuchsia);
        color: var(--white);
        border-color: var(--fuchsia);
      }
      .filter-chip .count {
        opacity: 0.5;
        margin-left: 4px;
        font-size: 0.65rem;
      }
      .filter-chip.active .count {
        opacity: 0.8;
        color: rgba(255,255,255,0.8);
      }
      .filter-actions {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-bottom: 8px;
      }
      .filter-link {
        font-family: 'Kalam', cursive;
        font-size: 0.75rem;
        color: var(--black);
        opacity: 0.4;
        cursor: pointer;
        background: none;
        border: none;
        text-decoration: underline;
        padding: 2px 6px;
      }
      .filter-link:active {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="top-area">
      <img class="sticker" src="assets/icons-bg/icon-01.png" style="top:5%;left:5%;transform:rotate(12deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-05.png" style="top:5%;right:5%;transform:rotate(-10deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-09.png" style="bottom:35%;left:5%;transform:rotate(18deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-14.png" style="bottom:35%;right:5%;transform:rotate(-15deg)" alt="">
      <img class="sticker" src="assets/icons-bg/icon-20.png" style="bottom:5%;left:5%;transform:rotate(22deg)" alt="">

      <img class="logo" src="assets/logo-explotado.png" alt="CumplePop">

      <div class="counter" id="questionCounter"></div>

      <div class="filter-actions">
        <button class="filter-link" id="filterAllBtn">Seleccionar todas</button>
        <button class="filter-link" id="filterNoneBtn">Ninguna</button>
      </div>
      <div class="filter-bar" id="filterBar"></div>

      <div class="question-card" id="questionCard">
        <div class="q-category" id="qCategory"></div>
        <div class="q-text" id="qText"></div>
        <div class="q-answer" id="qAnswer"></div>
        <div class="q-meta">
          <span id="qType"></span>
          <span id="qDifficulty"></span>
        </div>
      </div>
    </div>

    <div class="reveal-bar">
      <button class="btn btn-reveal" id="btnReveal">Revelar respuesta</button>
      <button class="btn btn-reveal" id="btnHide" style="display:none">Ocultar respuesta</button>
    </div>

    <div class="bottom-bar">
      <button class="btn" id="btnPrev" disabled>←</button>
      <button class="btn btn-shuffle" id="btnShuffle" title="Barajar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      </button>
      <button class="btn btn-primary" id="btnNext">→</button>
    </div>

    <script>
      const btnPrev = document.getElementById('btnPrev')
      const btnNext = document.getElementById('btnNext')
      const btnReveal = document.getElementById('btnReveal')
      const btnHide = document.getElementById('btnHide')
      const btnShuffle = document.getElementById('btnShuffle')
      const questionCounter = document.getElementById('questionCounter')
      const qCategory = document.getElementById('qCategory')
      const qText = document.getElementById('qText')
      const qAnswer = document.getElementById('qAnswer')
      const qType = document.getElementById('qType')
      const qDifficulty = document.getElementById('qDifficulty')

      let allQuestions = []
      let questions = []
      let currentIndex = 0
      let revealAnswer = false
      let order = []

      const STORAGE_KEY = 'cumplepop_categories'
      let selectedCategories = new Set()

      function loadCategories() {
        const stored = localStorage.getItem(STORAGE_KEY)
        if (stored) {
          try { selectedCategories = new Set(JSON.parse(stored)) }
          catch(e) { selectedCategories = new Set() }
        }
      }

      function saveCategories() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...selectedCategories]))
      }

      function buildFilterBar() {
        const bar = document.getElementById('filterBar')
        const map = {}
        for (const q of allQuestions) {
          const c = q.categoria
          if (!map[c]) map[c] = 0
          map[c]++
        }
        bar.innerHTML = ''
        for (const [name, count] of Object.entries(map).sort((a, b) => b[1] - a[1])) {
          const chip = document.createElement('button')
          chip.className = 'filter-chip' + (selectedCategories.has(name) ? ' active' : '')
          chip.innerHTML = `${name} <span class="count">${count}</span>`
          chip.addEventListener('click', () => {
            if (selectedCategories.has(name)) {
              selectedCategories.delete(name)
              chip.classList.remove('active')
            } else {
              selectedCategories.add(name)
              chip.classList.add('active')
            }
            saveCategories()
            applyFilter()
          })
          bar.appendChild(chip)
        }
      }

      function applyFilter() {
        const cats = [...selectedCategories]
        questions = allQuestions.filter(q => cats.includes(q.categoria))
        order = weightedOrder(questions)
        currentIndex = 0
        revealAnswer = false
        renderLocal()
      }

      document.getElementById('filterAllBtn').addEventListener('click', () => {
        for (const q of allQuestions) selectedCategories.add(q.categoria)
        saveCategories()
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.add('active'))
        applyFilter()
      })

      document.getElementById('filterNoneBtn').addEventListener('click', () => {
        selectedCategories.clear()
        saveCategories()
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'))
        applyFilter()
      })

      function shuffle(arr) {
        const a = [...arr]
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1))
          ;[a[i], a[j]] = [a[j], a[i]]
        }
        return a
      }

      function weightedOrder(questions) {
        const weighted = []
        questions.forEach((q, i) => {
          const w = q.categoria === 'BookTok y Romantasy' ? 3 : 1
          for (let j = 0; j < w; j++) weighted.push(i)
        })
        return shuffle(weighted)
      }

      fetch('data/preguntas.json')
        .then(r => r.json())
        .then(data => {
          allQuestions = data
          loadCategories()
          if (selectedCategories.size === 0) {
            for (const q of allQuestions) selectedCategories.add(q.categoria)
            saveCategories()
          }
          buildFilterBar()
          applyFilter()
        })

      function renderLocal() {
        if (!order.length) return
        const qIdx = order[currentIndex]
        const q = questions[qIdx]
        if (!q) return

        questionCounter.textContent = `${currentIndex + 1} / ${order.length}`
        qCategory.textContent = q.categoria
        qText.textContent = q.pregunta
        qType.textContent = `Tipo: ${q.tipo}`
        qDifficulty.textContent = `Dificultad: ${q.dificultad}`

        if (revealAnswer) {
          qAnswer.textContent = q.respuesta
          qAnswer.classList.add('visible')
          btnReveal.style.display = 'none'
          btnHide.style.display = ''
        } else {
          qAnswer.classList.remove('visible')
          qAnswer.textContent = ''
          btnReveal.style.display = ''
          btnHide.style.display = 'none'
        }

        btnPrev.disabled = currentIndex <= 0
        btnNext.disabled = currentIndex >= order.length - 1
      }

      btnPrev.onclick = () => {
        if (currentIndex > 0) {
          currentIndex--
          revealAnswer = false
          renderLocal()
        }
      }

      btnNext.onclick = () => {
        if (currentIndex < order.length - 1) {
          currentIndex++
          revealAnswer = false
          renderLocal()
        }
      }

      btnReveal.onclick = () => {
        revealAnswer = true
        renderLocal()
      }

      btnHide.onclick = () => {
        revealAnswer = false
        renderLocal()
      }

      btnShuffle.onclick = () => {
        order = weightedOrder(questions)
        currentIndex = 0
        revealAnswer = false
        renderLocal()
        questionCounter.textContent = `Barajado — ${order.length} preguntas`
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          e.preventDefault()
          btnPrev.click()
        } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          e.preventDefault()
          btnNext.click()
        } else if (e.key === ' ') {
          e.preventDefault()
          if (revealAnswer) btnHide.click()
          else btnReveal.click()
        }
      })
    </script>
  </body>
</html>
