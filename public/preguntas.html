<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F5;
        --black: #1A1A1A;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
        font-family: 'IBM Plex Serif', serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: min(90vw, 90vh);
        height: auto;
        position: relative;
        z-index: 2;
      }

      .ghost-question {
        position: absolute;
        font-size: clamp(24px, 3.5vw, 42px);
        font-family: 'IBM Plex Serif', serif;
        color: var(--black);
        pointer-events: none;
        max-width: 420px;
        text-align: center;
        line-height: 1.3;
        z-index: 1;
      }

      .ghost-question .word {
        display: inline-block;
        filter: blur(8px);
        opacity: 0;
        transition: filter 0.6s ease-out, opacity 0.6s ease-out;
      }

      .ghost-question.reveal .word {
        filter: blur(4px);
        opacity: 0.22;
      }

      .ghost-question.fading .word {
        filter: blur(8px);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <img src="assets/logo-explotado.png" alt="CumplePop" class="logo">

    <script>
      let questions = []
      const placed = []

      fetch('data/preguntas.json')
        .then(r => r.json())
        .then(data => { questions = data })

      function collides(x, y, w, h) {
        const pad = 20
        for (const p of placed) {
          if (x < p.x + p.w + pad && x + w + pad > p.x &&
              y < p.y + p.h + pad && y + h + pad > p.y) {
            return true
          }
        }
        return false
      }

      function findSlot(w, h) {
        for (let attempt = 0; attempt < 50; attempt++) {
          const x = Math.random() * (window.innerWidth - w - 40) + 20
          const y = Math.random() * (window.innerHeight - h - 40) + 20
          if (!collides(x, y, w, h)) return { x, y }
        }
        return null
      }

      function spawnGhost() {
        if (!questions.length) return
        const q = questions[Math.floor(Math.random() * questions.length)]

        const measure = document.createElement('div')
        measure.style.cssText = 'position:absolute;visibility:hidden;font-size:clamp(24px,3.5vw,42px);font-family:"IBM Plex Serif",serif;max-width:420px;text-align:center;line-height:1.3;'
        measure.textContent = q.pregunta
        document.body.appendChild(measure)
        const w = measure.offsetWidth
        const h = measure.offsetHeight
        measure.remove()

        const slot = findSlot(w, h)
        if (!slot) return

        const el = document.createElement('div')
        el.className = 'ghost-question'
        el.style.left = slot.x + 'px'
        el.style.top = slot.y + 'px'
        el.style.transform = 'rotate(' + (-4 + Math.random() * 8) + 'deg)'

        const words = q.pregunta.split(/\s+/)
        words.forEach((word, i) => {
          const span = document.createElement('span')
          span.className = 'word'
          span.textContent = word
          span.style.transitionDelay = (i * 0.12) + 's'
          el.appendChild(span)
          if (i < words.length - 1) el.appendChild(document.createTextNode(' '))
        })

        document.body.appendChild(el)
        placed.push({ x: slot.x, y: slot.y, w, h, el })

        requestAnimationFrame(() => {
          el.classList.add('reveal')
        })

        const revealTime = words.length * 120 + 600
        const holdTime = 2500 + Math.random() * 2000

        setTimeout(() => {
          el.classList.add('fading')
          el.classList.remove('reveal')
          setTimeout(() => {
            const idx = placed.findIndex(p => p.el === el)
            if (idx > -1) placed.splice(idx, 1)
            el.remove()
          }, 800)
        }, revealTime + holdTime)
      }

      setInterval(spawnGhost, 3000)
    </script>
  </body>
</html>
