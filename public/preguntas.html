<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop — Preguntas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Serif+Plex:wght@400;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F5;
        --fuchsia: #FF1493;
        --yellow: #FFD700;
        --black: #1A1A1A;
        --white: #FFFFFF;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        color: var(--black);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        padding: 0 6vw;
      }

      .logo {
        width: clamp(120px, 18vw, 260px);
        height: auto;
        margin-bottom: clamp(16px, 3vh, 40px);
        filter: drop-shadow(3px 3px 0px var(--black));
      }

      .category {
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: clamp(0.9rem, 2.2vw, 1.5rem);
        color: var(--fuchsia);
        border: 3px solid var(--black);
        box-shadow: 4px 4px 0px var(--black);
        background: var(--white);
        padding: 0.35em 1.2em;
        border-radius: 999px;
        margin-bottom: clamp(12px, 2.5vh, 32px);
        transform: rotate(-2deg);
        letter-spacing: 0.02em;
      }

      .question-number {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: clamp(0.85rem, 1.8vw, 1.2rem);
        color: var(--black);
        opacity: 0.35;
        margin-bottom: clamp(8px, 2vh, 24px);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .question-text {
        font-family: 'IBM Serif Plex', Georgia, serif;
        font-weight: 700;
        font-size: clamp(1.8rem, 5vw, 4rem);
        color: var(--black);
        line-height: 1.3;
        max-width: 75ch;
        margin: 0 auto clamp(20px, 4vh, 48px);
        text-align: center;
      }

      .answer-box {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: clamp(3rem, 10vw, 8rem);
        color: var(--fuchsia);
        border: 5px solid var(--black);
        box-shadow: 8px 8px 0px var(--black);
        background: var(--white);
        padding: 0.15em 0.7em;
        border-radius: 24px;
        opacity: 0;
        transform: scale(0.5);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .answer-box.visible {
        opacity: 1;
        transform: scale(1);
      }

      .btn-next {
        position: absolute;
        bottom: clamp(20px, 4vh, 48px);
        right: clamp(20px, 4vw, 48px);
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: clamp(0.95rem, 1.8vw, 1.4rem);
        color: var(--white);
        background: var(--fuchsia);
        border: 3px solid var(--black);
        box-shadow: 4px 4px 0px var(--black);
        padding: 0.55em 1.5em;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        letter-spacing: 0.01em;
      }
      .btn-next:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px var(--black);
      }
      .btn-next:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .deco {
        position: absolute;
        pointer-events: none;
        opacity: 0.12;
        font-size: clamp(2rem, 5vw, 5rem);
      }
      .deco-1 { top: 5vh; left: 4vw; transform: rotate(15deg); }
      .deco-2 { top: 8vh; right: 5vw; transform: rotate(-10deg); }
      .deco-3 { bottom: 8vh; left: 6vw; transform: rotate(8deg); }
      .deco-4 { bottom: 14vh; right: 10vw; transform: rotate(-15deg); }

      .connecting {
        font-family: 'Fredoka', sans-serif;
        font-size: 1.5rem;
        color: var(--fuchsia);
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <div class="deco deco-1">⭐</div>
      <div class="deco deco-2">🎉</div>
      <div class="deco deco-3">🎈</div>
      <div class="deco deco-4">💥</div>

      <div class="connecting" id="connecting">Conectando...</div>

      <div id="content" style="display:none;">
        <img src="assets/cumplepop.png" alt="CumplePop" class="logo">
        <div class="category" id="category"></div>
        <div class="question-number" id="questionNumber"></div>
        <div class="question-text" id="questionText"></div>
        <div class="answer-box" id="answerBox"></div>
      </div>

      <button class="btn-next" id="btnNext" style="display:none;">Siguiente →</button>
    </div>

    <script>
      const connecting = document.getElementById('connecting')
      const content = document.getElementById('content')
      const categoryEl = document.getElementById('category')
      const questionNumberEl = document.getElementById('questionNumber')
      const questionTextEl = document.getElementById('questionText')
      const answerBox = document.getElementById('answerBox')
      const btnNext = document.getElementById('btnNext')

      let questions = []
      let ws = null
      let currentIndex = 0
      let order = []

      fetch('/data/preguntas.json')
        .then(r => r.json())
        .then(data => {
          questions = data
          connectWS()
        })

      function connectWS() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws'
        ws = new WebSocket(`${proto}://${location.host}`)

        ws.onopen = () => {
          connecting.style.display = 'none'
          content.style.display = ''
          btnNext.style.display = ''
        }

        ws.onclose = () => {
          connecting.style.display = ''
          content.style.display = 'none'
          btnNext.style.display = 'none'
          setTimeout(connectWS, 2000)
        }

        ws.onmessage = (e) => {
          const state = JSON.parse(e.data)
          currentIndex = state.questionIndex || 0
          order = state.order || questions.map((_, i) => i)
          render(state)
        }
      }

      function render(state) {
        if (!questions.length || !order.length) return
        const qIdx = order[currentIndex]
        const q = questions[qIdx]
        if (!q) return

        categoryEl.textContent = q.categoria
        questionNumberEl.textContent = `Pregunta ${currentIndex + 1} de ${order.length}`
        questionTextEl.textContent = q.pregunta

        if (state.revealAnswer) {
          answerBox.textContent = q.respuesta
          answerBox.classList.add('visible')
        } else {
          answerBox.classList.remove('visible')
          answerBox.textContent = ''
        }

        btnNext.disabled = currentIndex >= order.length - 1
      }

      btnNext.addEventListener('click', () => {
        if (currentIndex < order.length - 1 && ws && ws.readyState === 1) {
          ws.send(JSON.stringify({
            type: 'question',
            questionIndex: currentIndex + 1,
            revealAnswer: false,
          }))
        }
      })
    </script>
  </body>
</html>
