<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #FDF8F5;
        --black: #1A1A1A;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
        font-family: 'Kalam', cursive;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: min(90vw, 90vh);
        height: auto;
        position: relative;
        z-index: 2;
      }

      .ghost-question {
        position: absolute;
        font-size: clamp(28px, 4.5vw, 50px);
        color: var(--black);
        opacity: 0;
        filter: blur(2px);
        pointer-events: none;
        max-width: 500px;
        text-align: center;
        line-height: 1.3;
        z-index: 1;
        transition: opacity 1.8s ease-in-out;
      }

      .ghost-question.visible {
        opacity: 0.18;
      }
    </style>
  </head>
  <body>
    <img src="assets/logo-explotado.png" alt="CumplePop" class="logo">

    <script>
      let questions = []

      fetch('data/preguntas.json')
        .then(r => r.json())
        .then(data => { questions = data })

      function randomPos() {
        const x = 5 + Math.random() * 80
        const y = 5 + Math.random() * 85
        return { x, y }
      }

      function spawnGhost() {
        if (!questions.length) return
        const q = questions[Math.floor(Math.random() * questions.length)]
        const el = document.createElement('div')
        el.className = 'ghost-question'
        el.textContent = q.pregunta
        const pos = randomPos()
        el.style.left = pos.x + '%'
        el.style.top = pos.y + '%'
        el.style.transform = 'translate(-50%, -50%) rotate(' + (-5 + Math.random() * 10) + 'deg)'
        document.body.appendChild(el)

        requestAnimationFrame(() => {
          el.classList.add('visible')
        })

        setTimeout(() => {
          el.classList.remove('visible')
          setTimeout(() => el.remove(), 2000)
        }, 3000 + Math.random() * 3000)
      }

      setInterval(spawnGhost, 1200)
    </script>
  </body>
</html>
