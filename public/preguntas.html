<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CumplePop</title>
    <style>
      :root {
        --cream: #FDF8F5;
        --black: #1A1A1A;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo {
        width: min(90vw, 90vh);
        height: auto;
      }
    </style>
  </head>
  <body>
    <img src="assets/logo-explotado.png" alt="CumplePop" class="logo">
  </body>
</html>
