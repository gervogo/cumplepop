<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CUMPLE POP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'UnicornPop';
      src: url('fonts/unicorn-pop.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --cream: #FDF8F5;
      --fuchsia: #FF1493;
      --yellow: #FFD700;
      --lila: #DDA0DD;
      --black: #1A1A1A;
      --white: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--cream);
      font-family: 'Kalam', cursive;
    }
    #canvas-container {
      width: 100%; height: 100%;
      position: relative;
    }
    canvas { display: block; position: relative; z-index: 5; }

    /* ===== DECORATIONS (washi tape + SVG shapes) ===== */
    .deco {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .washi-tape {
      position: absolute;
      height: 30px;
      z-index: 1;
      pointer-events: none;
      border: 2px solid var(--black);
    }
    .wt1 { top: 8px; left: 6%; width: 110px; transform: rotate(-8deg); background: repeating-linear-gradient(90deg, #FFB6C1, #FFB6C1 5px, transparent 5px, transparent 10px); }
    .wt2 { top: 10px; right: 8%; width: 95px; transform: rotate(6deg); background: repeating-linear-gradient(90deg, #B0E0E6, #B0E0E6 5px, transparent 5px, transparent 10px); }
    .wt3 { bottom: 8px; left: 12%; width: 115px; transform: rotate(4deg); background: repeating-linear-gradient(90deg, var(--lila), var(--lila) 5px, transparent 5px, transparent 10px); }
    .wt4 { bottom: 10px; right: 10%; width: 100px; transform: rotate(-5deg); background: repeating-linear-gradient(90deg, #98FB98, #98FB98 5px, transparent 5px, transparent 10px); }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    /* ===== SPLASH — ZINE POP ===== */
    #splash {
      background: rgba(253, 248, 245, 0.82);
      padding: 0;
      gap: 0;
      overflow: hidden;
      justify-content: center;
    }

    /* SVG decorative background shapes */
    .zine-deco {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }
    .zine-star1 { top: 6%; left: 8%; transform: rotate(12deg); }
    .zine-star2 { top: 15%; right: 12%; transform: rotate(-8deg); }
    .zine-star3 { bottom: 22%; left: 5%; transform: rotate(20deg); }
    .zine-heart1 { top: 12%; left: 60%; transform: rotate(-5deg); }
    .zine-heart2 { bottom: 18%; right: 8%; transform: rotate(10deg); }
    .zine-doodle1 { bottom: 30%; left: 10%; transform: rotate(-15deg); }
    .zine-doodle2 { top: 25%; right: 6%; transform: rotate(8deg); }

    /* Title block */
    .title-block {
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .title-cumple {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(3.2rem, 14vw, 5rem);
      color: var(--fuchsia);
      border: 3px solid var(--black);
      box-shadow: 5px 5px 0px var(--black);
      background: var(--white);
      padding: 4px 20px;
      display: inline-block;
      transform: rotate(-3deg);
      line-height: 1.1;
      letter-spacing: 2px;
    }
    .title-pop {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(3.5rem, 16vw, 5.5rem);
      color: var(--yellow);
      border: 3px solid var(--black);
      box-shadow: 5px 5px 0px var(--black);
      background: var(--white);
      padding: 4px 24px;
      display: inline-block;
      transform: rotate(2deg);
      margin-top: -6px;
      line-height: 1.1;
      letter-spacing: 3px;
    }

    /* Torn paper subtitle */
    .torn-paper {
      position: relative;
      z-index: 10;
      background: var(--white);
      border: 2px dashed var(--black);
      padding: 8px 20px;
      margin-top: 12px;
      transform: rotate(-1deg);
      max-width: 280px;
    }
    .torn-paper p {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--black);
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }

    /* Balloon sticker */
    .balloon-sticker {
      position: relative;
      z-index: 10;
      margin: 20px 0 16px;
    }
    .balloon-body {
      width: clamp(140px, 38vw, 180px);
      height: clamp(170px, 48vw, 220px);
      background: #FF1744;
      border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%;
      border: 3px solid var(--black);
      position: relative;
      box-shadow: 5px 5px 0px var(--black);
      transform: rotate(-3deg);
    }
    .balloon-body::before {
      /* White sticker outline */
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      border: 3px solid var(--white);
      pointer-events: none;
    }
    .balloon-shine {
      position: absolute;
      top: 18%;
      left: 22%;
      width: 35%;
      height: 30%;
      background: var(--white);
      border-radius: 50% 30% 50% 50%;
      transform: rotate(-25deg);
      opacity: 0.9;
    }
    .balloon-shine2 {
      position: absolute;
      top: 25%;
      left: 28%;
      width: 12%;
      height: 15%;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
    }
    .balloon-knot {
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 14px;
      background: #CC1144;
      border: 2px solid var(--black);
      border-radius: 0 0 50% 50%;
      clip-path: polygon(15% 0%, 85% 0%, 100% 60%, 50% 100%, 0% 60%);
    }
    .balloon-string {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 40px;
      background: var(--black);
      opacity: 0.5;
    }

    /* Sticky note */
    .sticky-note {
      position: absolute;
      bottom: 12%;
      right: -10px;
      width: clamp(90px, 24vw, 110px);
      background: var(--yellow);
      border: 2px solid var(--black);
      box-shadow: 4px 4px 0px var(--black);
      padding: 10px 8px;
      transform: rotate(5deg);
      z-index: 11;
    }
    .sticky-note p {
      font-family: 'Kalam', cursive;
      font-weight: 700;
      font-size: clamp(0.65rem, 2.2vw, 0.8rem);
      color: var(--black);
      text-align: center;
      line-height: 1.3;
    }

    /* JUGAR button */
    .btn-jugar {
      position: relative;
      z-index: 10;
      background: var(--fuchsia);
      color: var(--white);
      border: 3px solid var(--black);
      box-shadow: 6px 6px 0px var(--black);
      border-radius: 12px;
      padding: 18px 56px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      letter-spacing: 2px;
      cursor: pointer;
      transform: rotate(-1deg);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      margin-top: 8px;
    }
    .btn-jugar:active {
      transform: translate(4px, 4px) rotate(-1deg);
      box-shadow: 2px 2px 0px var(--black);
    }

    /* ===== COUNTDOWN ===== */
    #countdown {
      background: rgba(26,26,26,0.9);
      pointer-events: none;
    }
    .count-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .count-ring {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid rgba(255,20,147,0.4);
      animation: countRingPulse 1s ease-out;
    }
    @keyframes countRingPulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    #countdown .count-num {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(6rem, 22vw, 10rem);
      color: var(--white);
      text-shadow: 4px 4px 0px var(--fuchsia);
      animation: countPop 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      line-height: 1;
    }
    @keyframes countPop {
      0% { transform: scale(2.5) rotate(-8deg); opacity: 0; }
      60% { transform: scale(0.9) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .count-label {
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 16px;
      font-weight: 700;
    }

    /* ===== RESULT ===== */
    #result {
      background: var(--cream);
      padding: 0;
      gap: 0;
    }
    .result-explosion {
      position: relative;
      margin-bottom: 16px;
    }
    .result-emoji {
      width: clamp(180px, 40vw, 360px);
      height: auto;
      animation: resultBounce 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes resultBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.15) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .result-rings {
      position: absolute;
      inset: -30px;
      pointer-events: none;
    }
    .result-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,20,147,0.2);
      animation: resultRingExpand 1.2s ease-out forwards;
    }
    .result-ring:nth-child(2) { animation-delay: 0.15s; }
    .result-ring:nth-child(3) { animation-delay: 0.3s; }
    @keyframes resultRingExpand {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .result-title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.5rem);
      color: var(--fuchsia);
      border: 3px solid var(--black);
      box-shadow: 5px 5px 0px var(--black);
      background: var(--white);
      padding: 6px 24px;
      transform: rotate(-2deg);
      margin-bottom: 16px;
      line-height: 1.1;
    }
    .result-score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
    }
    .result-time {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 12vw, 5rem);
      color: var(--black);
      line-height: 1;
    }
    .result-unit {
      font-family: 'Kalam', cursive;
      font-size: 1.1rem;
      color: var(--black);
      font-weight: 700;
      opacity: 0.6;
    }
    #result p {
      font-family: 'Kalam', cursive;
      font-size: 1rem;
      color: var(--black);
      opacity: 0.6;
      margin-bottom: 28px;
    }
    .btn-replay {
      background: var(--fuchsia);
      color: var(--white);
      border: 3px solid var(--black);
      box-shadow: 6px 6px 0px var(--black);
      border-radius: 12px;
      padding: 16px 48px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 4vw, 1.4rem);
      letter-spacing: 2px;
      cursor: pointer;
      transform: rotate(1deg);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-replay:active {
      transform: translate(4px, 4px) rotate(1deg);
      box-shadow: 2px 2px 0px var(--black);
    }

    /* Explosion flash */
    .flash {
      position: absolute;
      inset: 0;
      background: var(--white);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.08s;
    }
    .flash.bang { opacity: 0.85; }

    /* Hide UI on mobile during game */
    @media (max-width: 768px) {
      .ui-layer { display: none !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="canvas-container">
  <!-- Washi tape corners -->
  <div class="washi-tape wt1"></div>
  <div class="washi-tape wt2"></div>
  <div class="washi-tape wt3"></div>
  <div class="washi-tape wt4"></div>

  <!-- SVG decorative shapes -->
  <div class="zine-deco zine-star1">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><path d="M20 2L24 14L36 14L26 22L30 34L20 26L10 34L14 22L4 14L16 14Z" fill="#FFD700" stroke="#1A1A1A" stroke-width="2"/></svg>
  </div>
  <div class="zine-deco zine-star2">
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none"><path d="M20 2L24 14L36 14L26 22L30 34L20 26L10 34L14 22L4 14L16 14Z" fill="#DDA0DD" stroke="#1A1A1A" stroke-width="2"/></svg>
  </div>
  <div class="zine-deco zine-star3">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none"><path d="M20 2L24 14L36 14L26 22L30 34L20 26L10 34L14 22L4 14L16 14Z" fill="#FFB6C1" stroke="#1A1A1A" stroke-width="2"/></svg>
  </div>
  <div class="zine-deco zine-heart1">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none"><path d="M18 32L3 17C-1 13 0 6 6 4C10 2 14 4 18 10C22 4 26 2 30 4C36 6 37 13 33 17L18 32Z" fill="#FF1493" stroke="#1A1A1A" stroke-width="2"/></svg>
  </div>
  <div class="zine-deco zine-heart2">
    <svg width="30" height="30" viewBox="0 0 36 36" fill="none"><path d="M18 32L3 17C-1 13 0 6 6 4C10 2 14 4 18 10C22 4 26 2 30 4C36 6 37 13 33 17L18 32Z" fill="#FFB6C1" stroke="#1A1A1A" stroke-width="2"/></svg>
  </div>
  <div class="zine-deco zine-doodle1">
    <svg width="44" height="20" viewBox="0 0 44 20" fill="none"><path d="M2 10Q8 2 14 10Q20 18 26 10Q32 2 38 10Q42 16 44 10" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </div>
  <div class="zine-deco zine-doodle2">
    <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><circle cx="15" cy="15" r="10" stroke="#1A1A1A" stroke-width="2" fill="none"/><path d="M15 5V25M5 15H25" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/></svg>
  </div>

  <div class="flash" id="flash"></div>

  <!-- ===== SPLASH SCREEN ===== -->
  <div class="screen active" id="splash">
    <div class="title-block">
      <img src="assets/cumplepop.png" alt="CumplePop" style="max-width: 70vw; max-height: 22vh; object-fit: contain;">
    </div>

    <button class="btn-jugar" id="startBtn">JUGAR</button>
  </div>

  <!-- ===== COUNTDOWN ===== -->
  <div class="screen" id="countdown">
    <div class="count-container">
      <div class="count-ring"></div>
      <div class="count-num" id="countNum">3</div>
    </div>
    <div class="count-label">Preparate</div>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div class="screen" id="result">
    <div class="result-explosion">
      <img class="result-emoji" src="assets/logo-explotado.png" alt="CumplePop explotado">
      <div class="result-rings">
        <div class="result-ring"></div>
        <div class="result-ring"></div>
        <div class="result-ring"></div>
      </div>
    </div>
    <div class="result-title">¡BOOM!</div>
    <div class="result-score">
      <span class="result-time" id="resultTime">0</span>
      <span class="result-unit">segundos</span>
    </div>
    <p id="resultText">El globo explotó</p>
    <button class="btn-replay" id="restartBtn">JUGAR DE NUEVO</button>
  </div>
</div>

<!-- Haptic overlay — outside canvas-container, direct child of body -->
<div id="haptic-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:none;">
  <input type="checkbox" switch id="game-haptic"
    style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.01;-webkit-appearance:auto;appearance:auto;margin:0;padding:0;border:none;background:transparent;">
</div>

<script>
(function() {
  // ======== STATE ========
  const MIN_TIME = 50;
  const MAX_TIME = 140;
  let totalTime = 100;
  let timeLeft = totalTime;
  let isExploded = false;
  let gameStarted = false;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  // Physics state
  const physics = {
    // Rotation (visual tilt via spring-damper)
    targetTiltX: 0,
    targetTiltZ: 0,
    currentTiltX: 0,
    currentTiltZ: 0,
    velX: 0,
    velZ: 0,
    spring: 0.04,
    damping: 0.92,
    // Position (bounce physics)
    posX: 0,
    posY: 0,
    velPX: 0,
    velPY: 0,
    friction: 0.90,
    accelScale: 0.08,
    // Bounce
    bounceEnergy: 0.5,
    boundX: 0.7,
    boundY: 1.2,
    // Float
    floatPhase: 0,
    floatSpeed: 1.2,
    floatAmp: 0.15,
    baseY: 0,
  };

  // ======== DOM ========
  const splash = document.getElementById('splash');
  const countdownEl = document.getElementById('countdown');
  const countNum = document.getElementById('countNum');
  const resultEl = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const resultTime = document.getElementById('resultTime');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  // ======== HAPTICS ========
  // iOS 26.5+: haptic SOLO dispara cuando el usuario toca físicamente un <input switch>.
  // No hay forma programática. La solución: overlay a pantalla completa durante el juego.
  const hapticOverlay = document.getElementById('haptic-overlay');
  const hapticSwitch = document.getElementById('game-haptic');
  const hasVibrate = 'vibrate' in navigator;
  let hapticInterval = null;

  let audioCtx = null;
  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function audioTick(vol) {
    try {
      ensureAudioCtx();
      const buf = audioCtx.createBuffer(1, 64, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / 25);
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2000 + vol * 2000;
      gain.gain.value = 0.35 * vol;
      src.buffer = buf;
      src.connect(gain);
      gain.connect(filter);
      filter.connect(audioCtx.destination);
      src.start();
    } catch(e) {}
  }

  function showHapticOverlay() {
    hapticOverlay.style.display = 'block';
    console.log('[HAPTIC] overlay shown', hapticSwitch.tagName, hapticSwitch.hasAttribute('switch'));
  }

  function hideHapticOverlay() {
    hapticOverlay.style.display = 'none';
    console.log('[HAPTIC] overlay hidden');
  }

  hapticSwitch.addEventListener('change', () => {
    console.log('[HAPTIC] switch toggled!');
  });

  function startAudioLoop() {
    if (hapticInterval) clearInterval(hapticInterval);
    hapticInterval = setInterval(() => {
      if (!gameStarted || isExploded) return;
      const progress = 1 - (timeLeft / totalTime);
      if (progress < 0.5) audioTick(0.3);
      else if (progress < 0.8) audioTick(0.6);
      else audioTick(0.9);
      if (hasVibrate) navigator.vibrate(15);
    }, 500);
  }

  function stopAudioLoop() {
    if (hapticInterval) { clearInterval(hapticInterval); hapticInterval = null; }
  }

  function triggerExplosionHaptic() {
    audioTick(1.0);
    setTimeout(() => audioTick(0.8), 80);
    setTimeout(() => audioTick(0.6), 160);
  }

  // ======== GYROSCOPE (filtered) ========
  let gyroPermissionGranted = false;
  let gyroEnabled = false;

  const gyroSmooth = { alpha: 0, beta: 45, gamma: 0 };
  const GYRO_FILTER = 0.3;
  const GYRO_DEADZONE = 3;

  function filterGyro(a, b, g) {
    gyroSmooth.alpha += GYRO_FILTER * (a - gyroSmooth.alpha);
    gyroSmooth.beta += GYRO_FILTER * (b - gyroSmooth.beta);
    gyroSmooth.gamma += GYRO_FILTER * (g - gyroSmooth.gamma);
    if (Math.abs(gyroSmooth.gamma) < GYRO_DEADZONE) gyroSmooth.gamma = 0;
  }

  function triggerHapticBurst() {
    if (hasVibrate) navigator.vibrate([30, 20, 30]);
  }

  async function requestGyroPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result === 'granted') { gyroPermissionGranted = true; startGyroListener(); }
      } catch(e) {}
    } else {
      gyroPermissionGranted = true;
      startGyroListener();
    }
  }

  function startGyroListener() {
    window.addEventListener('deviceorientation', (e) => {
      if (!gyroPermissionGranted || !gameStarted || isExploded) return;
      gyroEnabled = true;
      const g = e.gamma || 0, b = e.beta || 0, a = e.alpha || 0;
      filterGyro(a, b, g);

      // Tilt → rotation (visual)
      const normG = Math.max(-1, Math.min(1, g / 30));
      const normB = Math.max(-1, Math.min(1, (b - 45) / 30));
      physics.targetTiltZ = normG * 0.6;
      physics.targetTiltX = normB * 0.3;

      // Tilt → acceleration (physics bounce)
      physics.velPX += gyroSmooth.gamma * 0.003 * physics.accelScale;
      physics.velPY += (gyroSmooth.beta - 45) * 0.002 * physics.accelScale;
    });
  }

  // ======== THREE.JS SETUP ========
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xFFF5F8, 0.02);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.3, 4.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.insertBefore(renderer.domElement, container.firstChild);

  // ======== LIGHTING ========
  scene.add(new THREE.AmbientLight(0xFFE4EC, 0.6));

  const keyLight = new THREE.DirectionalLight(0xFFF0E0, 2.0);
  keyLight.position.set(3, 5, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.001;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xE0F0FF, 0.8);
  fillLight.position.set(-4, 2, 3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
  rimLight.position.set(0, 3, -5);
  scene.add(rimLight);

  const pointLight = new THREE.PointLight(0xFF80AB, 1.5, 10);
  pointLight.position.set(-1.5, 1, 2);
  scene.add(pointLight);

  // ======== BALLOON MATERIAL (PBR) ========
  const balloonGeo = new THREE.SphereGeometry(1, 128, 128);
  const balloonMat = new THREE.MeshPhysicalMaterial({
    color: 0xFF3366,
    roughness: 0.18,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    sheen: 1.0,
    sheenRoughness: 0.3,
    sheenColor: new THREE.Color(0xFF80AB),
    transmission: 0.08,
    thickness: 0.5,
    ior: 1.45,
    specularIntensity: 1.2,
    envMapIntensity: 1.0,
    side: THREE.DoubleSide
  });

  const balloon = new THREE.Mesh(balloonGeo, balloonMat);
  balloon.castShadow = true;
  balloon.receiveShadow = true;
  let splashPhase = 0;

  // Show balloon on splash screen
  balloon.visible = true;
  balloon.scale.set(0.8, 0.8, 0.8);
  balloonMat.color.set(0xFF3366);
  balloon.position.set(0, -0.2, 0);
  balloon.rotation.set(0, 0, -0.05);
  scene.add(balloon);

  // ======== BALLOON NECK & KNOT ========
  const neckMat = new THREE.MeshPhysicalMaterial({ color: 0xCC1144, roughness: 0.25, clearcoat: 0.8, clearcoatRoughness: 0.15 });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.35, 32), neckMat);
  neck.position.y = -1.05;
  neck.castShadow = true;
  balloon.add(neck);

  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), neckMat);
  knot.position.y = -1.25;
  knot.scale.set(1.3, 0.7, 1.3);
  balloon.add(knot);

  // ======== ENVIRONMENT MAP ========
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0xFFF0F5);
  const envLight1 = new THREE.DirectionalLight(0xFFFFFF, 2);
  envLight1.position.set(5, 10, 7);
  envScene.add(envLight1);
  const envLight2 = new THREE.DirectionalLight(0xFFE0F0, 1.5);
  envLight2.position.set(-5, 5, -3);
  envScene.add(envLight2);
  scene.environment = pmremGenerator.fromScene(envScene, 0.04).texture;

  // ======== GROUND SHADOW ========
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.15 }));
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -3.5;
  plane.receiveShadow = true;
  scene.add(plane);

  // ======== BALLOON FRAGMENTS ========
  const fragmentCount = 25;
  const fragments = [];
  const fragGroup = new THREE.Group();
  fragGroup.visible = false;
  scene.add(fragGroup);

  const fragColors = [0xFF3366, 0xFF1744, 0xFF5252, 0xFF80AB, 0xF50057, 0xCC1144, 0xE91E63];

  for (let i = 0; i < fragmentCount; i++) {
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array([
      0, 0, 0,
      (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.1,
      0, 0, 0,
      (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.1
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshPhysicalMaterial({
      color: fragColors[Math.floor(Math.random() * fragColors.length)],
      roughness: 0.3,
      metalness: 0.0,
      clearcoat: 0.8,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    fragGroup.add(mesh);
    fragments.push({
      mesh,
      vel: new THREE.Vector3(),
      rotVel: new THREE.Vector3(),
      life: 0
    });
  }

  function explodeFragments(origin) {
    fragGroup.visible = true;
    for (const f of fragments) {
      f.mesh.visible = true;
      f.mesh.position.copy(origin);
      f.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 2 + Math.random() * 6;
      f.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.abs(Math.sin(phi) * Math.sin(theta)) * speed + 2,
        Math.cos(phi) * speed * 0.5
      );
      f.rotVel.set(
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15
      );
      f.life = 1.0;
      const s = 0.5 + Math.random() * 1.2;
      f.mesh.scale.set(s, s, s);
    }
  }

  function updateFragments(dt) {
    if (!fragGroup.visible) return;
    let alive = 0;
    for (const f of fragments) {
      if (f.life <= 0) { f.mesh.visible = false; continue; }
      alive++;
      f.vel.y -= 6.0 * dt;
      f.mesh.position.x += f.vel.x * dt;
      f.mesh.position.y += f.vel.y * dt;
      f.mesh.position.z += f.vel.z * dt;
      f.mesh.rotation.x += f.rotVel.x * dt;
      f.mesh.rotation.y += f.rotVel.y * dt;
      f.mesh.rotation.z += f.rotVel.z * dt;
      f.life -= dt * 0.35;
    }
    if (alive === 0) fragGroup.visible = false;
  }

  // ======== INPUT (mouse fallback for desktop) ========
  document.addEventListener('mousemove', (e) => {
    if (!gameStarted || isExploded || gyroEnabled) return;
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -(e.clientY / window.innerHeight) * 2 + 1;
    physics.targetTiltZ = nx * 0.6;
    physics.targetTiltX = ny * 0.3;
    // Mouse position → velocity
    physics.velPX += nx * 0.04;
    physics.velPY += ny * 0.03;
  });

  // ======== INFLATION ========
  function getInflationScale() {
    const progress = 1 - (timeLeft / totalTime);
    return 0.5 + 0.65 * progress;
  }

  function getBalloonColor() {
    const progress = 1 - (timeLeft / totalTime);
    const c1 = new THREE.Color(0xFF3366);
    const c2 = new THREE.Color(0xFF0000);
    const c3 = new THREE.Color(0x880000);
    return progress < 0.5
      ? c1.clone().lerp(c2, progress * 2)
      : c2.clone().lerp(c3, (progress - 0.5) * 2);
  }

  // ======== TIMER ========
  let lastTime = performance.now();
  let timerAccum = 0;

  function updateTimer(dt) {
    if (isExploded) return;
    timerAccum += dt;
    if (timerAccum >= 1.0) {
      timerAccum -= 1.0;
      timeLeft = Math.max(0, timeLeft - 1);
      if (timeLeft <= 0) explodeBalloon();
    }
  }

  // ======== GAME FLOW ========
  function startCountdown() {
    splash.classList.remove('active');
    countdownEl.classList.add('active');
    requestGyroPermission();
    let count = 3;
    countNum.textContent = count;
    const countLabel = document.querySelector('.count-label');
    countLabel.textContent = 'Preparate';

    function animateCount() {
      countNum.style.animation = 'none';
      countNum.offsetHeight;
      countNum.style.animation = 'countPop 0.6s cubic-bezier(0.22, 1, 0.36, 1)';

      const container = document.querySelector('.count-container');
      const oldRing = container.querySelector('.count-ring');
      if (oldRing) oldRing.remove();
      const ring = document.createElement('div');
      ring.className = 'count-ring';
      container.appendChild(ring);
    }

    animateCount();
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countNum.textContent = count;
        animateCount();
      } else if (count === 0) {
        countNum.textContent = '¡YA!';
        countLabel.textContent = '';
        animateCount();
      } else {
        clearInterval(interval);
        countdownEl.classList.remove('active');
        startGame();
      }
    }, 1000);
  }

  function startGame() {
    totalTime = Math.floor(Math.random() * (MAX_TIME - MIN_TIME + 1)) + MIN_TIME;
    timeLeft = totalTime;
    isExploded = false;
    gameStarted = true;
    timerAccum = 0;

    balloon.visible = true;
    balloon.scale.set(0.5, 0.5, 0.5);
    balloonMat.color.set(0xFF3366);
    balloonMat.emissive = new THREE.Color(0x000000);
    balloonMat.emissiveIntensity = 0;
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);

    physics.currentTiltX = 0;
    physics.currentTiltZ = 0;
    physics.velX = 0;
    physics.velZ = 0;
    physics.posX = 0;
    physics.posY = 0;
    physics.velPX = 0;
    physics.velPY = 0;

    showHapticOverlay();
    startAudioLoop();
  }

  function explodeBalloon() {
    if (isExploded) return;
    isExploded = true;
    gameStarted = false;
    stopAudioLoop();
    hideHapticOverlay();

    triggerExplosionHaptic();

    document.getElementById('flash').classList.add('bang');
    setTimeout(() => document.getElementById('flash').classList.remove('bang'), 150);

    balloon.visible = false;

    explodeFragments(balloon.position.clone());

    setTimeout(() => {
      resultTime.textContent = totalTime;
      resultText.textContent = 'El globo explotó';

      const rings = resultEl.querySelectorAll('.result-ring');
      rings.forEach(r => {
        r.style.animation = 'none';
        r.offsetHeight;
        r.style.animation = '';
      });

      resultEl.classList.add('active');
    }, 800);
  }

  function resetGame() {
    isExploded = false;
    gameStarted = false;
    timerAccum = 0;
    stopAudioLoop();
    hideHapticOverlay();
    balloon.visible = true;
    balloon.scale.set(0.8, 0.8, 0.8);
    balloonMat.color.set(0xFF3366);
    balloonMat.emissive = new THREE.Color(0x000000);
    balloonMat.emissiveIntensity = 0;
    fragGroup.visible = false;
    for (const f of fragments) f.mesh.visible = false;
    physics.currentTiltX = physics.currentTiltZ = physics.velX = physics.velZ = 0;
    physics.posX = physics.posY = physics.velPX = physics.velPY = 0;
    balloon.rotation.set(0, 0, -0.05);
    balloon.position.set(0, -0.2, 0);
    resultEl.classList.remove('active');
    splash.classList.add('active');
  }

  startBtn.addEventListener('click', startCountdown);
  restartBtn.addEventListener('click', resetGame);

  // ======== EFFECT INDICATORS (removed — replaced by physics bounce) ========

  // ======== ANIMATION LOOP ========
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (gameStarted && !isExploded) {
      updateTimer(dt);

      const scale = getInflationScale();
      balloon.scale.set(scale, scale, scale);
      balloonMat.color.copy(getBalloonColor());

      // --- Rotation (spring-damper for visual tilt) ---
      physics.velX += (physics.targetTiltX - physics.currentTiltX) * physics.spring;
      physics.velZ += (physics.targetTiltZ - physics.currentTiltZ) * physics.spring;
      physics.velX *= physics.damping;
      physics.velZ *= physics.damping;
      physics.currentTiltX += physics.velX;
      physics.currentTiltZ += physics.velZ;

      balloon.rotation.x = physics.currentTiltX;
      balloon.rotation.z = physics.currentTiltZ;

      // --- Position (bounce physics) ---
      physics.velPX *= physics.friction;
      physics.velPY *= physics.friction;
      physics.posX += physics.velPX;
      physics.posY += physics.velPY;

      // Float bob
      physics.floatPhase += dt * physics.floatSpeed;
      const floatY = Math.sin(physics.floatPhase) * physics.floatAmp;

      // Edge bounce
      if (physics.posX > physics.boundX) {
        physics.posX = physics.boundX;
        physics.velPX *= -physics.bounceEnergy;
      } else if (physics.posX < -physics.boundX) {
        physics.posX = -physics.boundX;
        physics.velPX *= -physics.bounceEnergy;
      }
      if (physics.posY > physics.boundY) {
        physics.posY = physics.boundY;
        physics.velPY *= -physics.bounceEnergy;
      } else if (physics.posY < -physics.boundY) {
        physics.posY = -physics.boundY;
        physics.velPY *= -physics.bounceEnergy;
      }

      balloon.position.x = physics.posX;
      balloon.position.y = physics.baseY + floatY + physics.posY;
      balloon.position.z = -physics.currentTiltX * 0.3;

      // --- Squash-stretch ---
      const stretch = 1 + (scale - 0.4) * 0.03;
      const squash = 1 - (scale - 0.4) * 0.02;
      balloon.scale.y *= stretch;
      balloon.scale.x *= squash;
      balloon.scale.z *= squash;

      // --- Wobble near explosion ---
      const progress = 1 - (timeLeft / totalTime);
      if (progress > 0.75) {
        const wobble = (progress - 0.75) / 0.25;
        balloon.rotation.x += Math.sin(now * 0.02) * wobble * 0.08;
        balloon.rotation.z += Math.cos(now * 0.015) * wobble * 0.08;
      }
    } else if (!gameStarted && !isExploded) {
      // Splash / result idle float
      splashPhase += dt * 1.5;
      balloon.position.y = -0.2 + Math.sin(splashPhase) * 0.12;
      balloon.rotation.z = Math.sin(splashPhase * 0.7) * 0.03;
    }

    updateFragments(dt);
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
