<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎈 CUMPLE POP</title>
  <style>
    @font-face {
      font-family: 'UnicornPop';
      src: url('fonts/unicorn-pop.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(160deg, #FFF0F5 0%, #F3E5F5 40%, #FFF8E1 100%);
      font-family: 'UnicornPop', 'Segoe UI', system-ui, sans-serif;
    }
    #canvas-container {
      width: 100%; height: 100%;
      position: relative;
    }
    canvas { display: block; position: relative; z-index: 5; }

    /* Scrapbook decorations */
    .deco {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .deco-flower { font-size: 2.5rem; opacity: 0.45; }
    .f1 { top: 5%; left: 5%; transform: rotate(-15deg); }
    .f2 { top: 8%; right: 8%; transform: rotate(20deg); }
    .f3 { bottom: 10%; left: 7%; transform: rotate(10deg); }
    .f4 { bottom: 8%; right: 5%; transform: rotate(-25deg); }
    .f5 { top: 45%; left: 2%; transform: rotate(5deg); }
    .f6 { top: 50%; right: 3%; transform: rotate(-10deg); }

    .washi-tape {
      position: absolute;
      height: 28px;
      opacity: 0.65;
      z-index: 1;
      pointer-events: none;
    }
    .wt1 { top: -6px; left: 8%; width: 100px; transform: rotate(-8deg); background: repeating-linear-gradient(90deg, #FFB6C1, #FFB6C1 6px, transparent 6px, transparent 12px); }
    .wt2 { top: -4px; right: 10%; width: 90px; transform: rotate(6deg); background: repeating-linear-gradient(90deg, #B0E0E6, #B0E0E6 6px, transparent 6px, transparent 12px); }
    .wt3 { bottom: -6px; left: 15%; width: 110px; transform: rotate(4deg); background: repeating-linear-gradient(90deg, #DDA0DD, #DDA0DD 6px, transparent 6px, transparent 12px); }
    .wt4 { bottom: -4px; right: 12%; width: 95px; transform: rotate(-5deg); background: repeating-linear-gradient(90deg, #98FB98, #98FB98 6px, transparent 6px, transparent 12px); }

    /* ===== SCREENS ===== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.5s;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    /* ===== SPLASH ===== */
    #splash {
      background: linear-gradient(165deg, #FFF0F5 0%, #FCE4EC 30%, #F3E5F5 65%, #FFF8E1 100%);
      padding: 40px 24px;
      gap: 0;
    }
    #splash::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,105,180,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    #splash::after {
      content: '';
      position: absolute;
      bottom: -100px;
      left: -60px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(233,30,99,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .splash-balloon-icon {
      font-size: 5rem;
      margin-bottom: 8px;
      animation: balloonFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(233,30,99,0.2));
    }
    @keyframes balloonFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    #splash h2 {
      font-size: clamp(2.6rem, 8vw, 3.8rem);
      color: #E91E63;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 3px 3px 0 rgba(248,187,208,0.6);
      line-height: 1.1;
    }
    .splash-subtitle {
      font-size: 1rem;
      color: #AD1457;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0.7;
    }
    .splash-instructions {
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      padding: 20px 24px;
      max-width: 320px;
      width: 100%;
      margin-bottom: 32px;
      text-align: left;
    }
    .splash-instructions p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.65;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .splash-instructions p:last-child { margin-bottom: 0; }
    .instruction-icon {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      margin-top: 1px;
    }
    .icon-tilt { background: rgba(233,30,99,0.12); }
    .icon-timer { background: rgba(255,152,0,0.12); }
    .icon-boom { background: rgba(244,67,54,0.12); }

    .btn-play {
      position: relative;
      background: linear-gradient(135deg, #FF4081 0%, #E91E63 50%, #C2185B 100%);
      color: #FFF;
      border: none;
      border-radius: 60px;
      padding: 18px 56px;
      font-size: 1.3rem;
      font-weight: 800;
      font-family: 'UnicornPop', inherit;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow:
        0 4px 20px rgba(233,30,99,0.35),
        0 0 0 0 rgba(233,30,99,0),
        inset 0 1px 0 rgba(255,255,255,0.2);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .btn-play::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transition: left 0.5s;
    }
    .btn-play:hover::before { left: 100%; }
    .btn-play:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(233,30,99,0.3);
    }
    .btn-play-text { position: relative; z-index: 1; }

    /* ===== COUNTDOWN ===== */
    #countdown {
      background: rgba(30,10,20,0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      pointer-events: none;
    }
    .count-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .count-ring {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid rgba(255,64,129,0.3);
      animation: countRingPulse 1s ease-out;
    }
    @keyframes countRingPulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    #countdown .count-num {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 900;
      color: #FFF;
      text-shadow: 0 0 60px rgba(255,64,129,0.5), 0 0 120px rgba(255,64,129,0.2);
      animation: countPop 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      line-height: 1;
    }
    @keyframes countPop {
      0% { transform: scale(2.5) rotate(-8deg); opacity: 0; }
      60% { transform: scale(0.9) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .count-label {
      font-size: 1rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 16px;
      font-weight: 600;
    }

    /* ===== RESULT ===== */
    #result {
      background: linear-gradient(165deg, #FFF0F5 0%, #FCE4EC 40%, #F3E5F5 100%);
      padding: 40px 24px;
      gap: 0;
    }
    .result-explosion {
      position: relative;
      margin-bottom: 20px;
    }
    .result-emoji {
      font-size: 5.5rem;
      animation: resultBounce 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      filter: drop-shadow(0 8px 32px rgba(233,30,99,0.25));
    }
    @keyframes resultBounce {
      0% { transform: scale(0) rotate(-20deg); }
      60% { transform: scale(1.15) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .result-rings {
      position: absolute;
      inset: -30px;
      pointer-events: none;
    }
    .result-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(233,30,99,0.15);
      animation: resultRingExpand 1.2s ease-out forwards;
    }
    .result-ring:nth-child(2) { animation-delay: 0.15s; }
    .result-ring:nth-child(3) { animation-delay: 0.3s; }
    @keyframes resultRingExpand {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    #result h2 {
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      color: #E91E63;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      text-shadow: 2px 2px 0 rgba(248,187,208,0.5);
      line-height: 1.1;
    }
    .result-score {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }
    .result-time {
      font-size: clamp(3rem, 10vw, 4.5rem);
      font-weight: 900;
      color: #AD1457;
      line-height: 1;
    }
    .result-unit {
      font-size: 1.2rem;
      color: #AD1457;
      font-weight: 600;
      opacity: 0.7;
    }
    #result p {
      font-size: 1rem;
      color: #888;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }
    .btn-replay {
      position: relative;
      background: linear-gradient(135deg, #FF4081 0%, #E91E63 50%, #C2185B 100%);
      color: #FFF;
      border: none;
      border-radius: 60px;
      padding: 16px 48px;
      font-size: 1.15rem;
      font-weight: 800;
      font-family: 'UnicornPop', inherit;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(233,30,99,0.3);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-replay:active {
      transform: scale(0.95);
      box-shadow: 0 2px 10px rgba(233,30,99,0.25);
    }

    /* Explosion flash */
    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #FFF 0%, #FFE0EC 50%, transparent 80%);
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.08s;
    }
    .flash.bang { opacity: 0.8; }

    /* Hide UI on mobile during game */
    @media (max-width: 768px) {
      .ui-layer { display: none !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="canvas-container">
  <div class="washi-tape wt1"></div>
  <div class="washi-tape wt2"></div>
  <div class="washi-tape wt3"></div>
  <div class="washi-tape wt4"></div>

  <div class="deco deco-flower f1">🌸</div>
  <div class="deco deco-flower f2">🌼</div>
  <div class="deco deco-flower f3">🌷</div>
  <div class="deco deco-flower f4">🌺</div>
  <div class="deco deco-flower f5">💐</div>
  <div class="deco deco-flower f6">🌻</div>

  <div class="flash" id="flash"></div>

  <!-- Splash Screen -->
  <div class="screen active" id="splash">
    <div class="splash-balloon-icon">🎈</div>
    <h2>CUMPLE POP</h2>
    <div class="splash-subtitle">La Patata Caliente</div>
    <div class="splash-instructions">
      <p>
        <span class="instruction-icon icon-tilt">📱</span>
        Inclina el celular para mover el globo y mantenerlo en el aire
      </p>
      <p>
        <span class="instruction-icon icon-timer">⏱️</span>
        El globo crece solo &mdash; ¡cuanto más aguanto, más peligro!
      </p>
      <p>
        <span class="instruction-icon icon-boom">💥</span>
        Si explota, ¡pierdes! &mdash; El último en tocar gana
      </p>
    </div>
    <button class="btn-play" id="startBtn">
      <span class="btn-play-text">JUGAR</span>
    </button>
  </div>

  <!-- Countdown Overlay -->
  <div class="screen" id="countdown">
    <div class="count-container">
      <div class="count-ring"></div>
      <div class="count-num" id="countNum">3</div>
    </div>
    <div class="count-label">Preparate</div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="result">
    <div class="result-explosion">
      <div class="result-emoji">💥</div>
      <div class="result-rings">
        <div class="result-ring"></div>
        <div class="result-ring"></div>
        <div class="result-ring"></div>
      </div>
    </div>
    <h2>¡BOOM!</h2>
    <div class="result-score">
      <span class="result-time" id="resultTime">0</span>
      <span class="result-unit">segundos</span>
    </div>
    <p id="resultText">El globo explotó</p>
    <button class="btn-replay" id="restartBtn">JUGAR DE NUEVO</button>
  </div>
</div>

<!-- Haptic overlay — outside canvas-container, direct child of body -->
<div id="haptic-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:none;">
  <input type="checkbox" switch id="game-haptic"
    style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.01;-webkit-appearance:auto;appearance:auto;margin:0;padding:0;border:none;background:transparent;">
</div>

<script>
(function() {
  // ======== STATE ========
  const MIN_TIME = 50;
  const MAX_TIME = 140;
  let totalTime = 100;
  let timeLeft = totalTime;
  let isExploded = false;
  let gameStarted = false;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

  // Physics state
  const physics = {
    targetTiltX: 0,
    targetTiltZ: 0,
    currentTiltX: 0,
    currentTiltZ: 0,
    floatPhase: 0,
    floatSpeed: 1.2,
    floatAmp: 0.15,
    baseY: 0,
    velX: 0,
    velZ: 0,
    damping: 0.92,
    spring: 0.04,
    maxTilt: 0.6
  };

  // ======== DOM ========
  const splash = document.getElementById('splash');
  const countdownEl = document.getElementById('countdown');
  const countNum = document.getElementById('countNum');
  const resultEl = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const resultTime = document.getElementById('resultTime');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  // ======== HAPTICS ========
  // iOS 26.5+: haptic SOLO dispara cuando el usuario toca físicamente un <input switch>.
  // No hay forma programática. La solución: overlay a pantalla completa durante el juego.
  const hapticOverlay = document.getElementById('haptic-overlay');
  const hapticSwitch = document.getElementById('game-haptic');
  const hasVibrate = 'vibrate' in navigator;
  let hapticInterval = null;

  let audioCtx = null;
  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function audioTick(vol) {
    try {
      ensureAudioCtx();
      const buf = audioCtx.createBuffer(1, 64, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / 25);
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 2000 + vol * 2000;
      gain.gain.value = 0.35 * vol;
      src.buffer = buf;
      src.connect(gain);
      gain.connect(filter);
      filter.connect(audioCtx.destination);
      src.start();
    } catch(e) {}
  }

  function showHapticOverlay() {
    hapticOverlay.style.display = 'block';
    console.log('[HAPTIC] overlay shown', hapticSwitch.tagName, hapticSwitch.hasAttribute('switch'));
  }

  function hideHapticOverlay() {
    hapticOverlay.style.display = 'none';
    console.log('[HAPTIC] overlay hidden');
  }

  hapticSwitch.addEventListener('change', () => {
    console.log('[HAPTIC] switch toggled!');
  });

  function startAudioLoop() {
    if (hapticInterval) clearInterval(hapticInterval);
    hapticInterval = setInterval(() => {
      if (!gameStarted || isExploded) return;
      const progress = 1 - (timeLeft / totalTime);
      if (progress < 0.5) audioTick(0.3);
      else if (progress < 0.8) audioTick(0.6);
      else audioTick(0.9);
    }, 500);
  }

  function stopAudioLoop() {
    if (hapticInterval) { clearInterval(hapticInterval); hapticInterval = null; }
  }

  function triggerExplosionHaptic() {
    audioTick(1.0);
    setTimeout(() => audioTick(0.8), 80);
    setTimeout(() => audioTick(0.6), 160);
  }

  // ======== GYROSCOPE ========
  let gyroPermissionGranted = false;
  let gyroEnabled = false;

  async function requestGyroPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const result = await DeviceOrientationEvent.requestPermission();
        if (result === 'granted') {
          gyroPermissionGranted = true;
          startGyroListener();
        }
      } catch(e) {}
    } else {
      gyroPermissionGranted = true;
      startGyroListener();
    }
  }

  function startGyroListener() {
    window.addEventListener('deviceorientation', (e) => {
      if (!gyroPermissionGranted || !gameStarted || isExploded) return;
      gyroEnabled = true;
      const gamma = e.gamma || 0;
      const beta = e.beta || 0;
      const normGamma = Math.max(-1, Math.min(1, gamma / 30));
      const normBeta = Math.max(-1, Math.min(1, (beta - 45) / 30));
      physics.targetTiltZ = normGamma * physics.maxTilt;
      physics.targetTiltX = normBeta * physics.maxTilt * 0.5;
    });
  }

  // ======== THREE.JS SETUP ========
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xFFF5F8, 0.02);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.3, 4.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.insertBefore(renderer.domElement, container.firstChild);

  // ======== LIGHTING ========
  scene.add(new THREE.AmbientLight(0xFFE4EC, 0.6));

  const keyLight = new THREE.DirectionalLight(0xFFF0E0, 2.0);
  keyLight.position.set(3, 5, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.001;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xE0F0FF, 0.8);
  fillLight.position.set(-4, 2, 3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
  rimLight.position.set(0, 3, -5);
  scene.add(rimLight);

  const pointLight = new THREE.PointLight(0xFF80AB, 1.5, 10);
  pointLight.position.set(-1.5, 1, 2);
  scene.add(pointLight);

  // ======== BALLOON MATERIAL (PBR) ========
  const balloonGeo = new THREE.SphereGeometry(1, 128, 128);
  const balloonMat = new THREE.MeshPhysicalMaterial({
    color: 0xFF3366,
    roughness: 0.18,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    sheen: 1.0,
    sheenRoughness: 0.3,
    sheenColor: new THREE.Color(0xFF80AB),
    transmission: 0.08,
    thickness: 0.5,
    ior: 1.45,
    specularIntensity: 1.2,
    envMapIntensity: 1.0,
    side: THREE.DoubleSide
  });

  const balloon = new THREE.Mesh(balloonGeo, balloonMat);
  balloon.castShadow = true;
  balloon.receiveShadow = true;
  balloon.visible = false;
  scene.add(balloon);

  // ======== BALLOON NECK & KNOT ========
  const neckMat = new THREE.MeshPhysicalMaterial({ color: 0xCC1144, roughness: 0.25, clearcoat: 0.8, clearcoatRoughness: 0.15 });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.35, 32), neckMat);
  neck.position.y = -1.05;
  neck.castShadow = true;
  balloon.add(neck);

  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), neckMat);
  knot.position.y = -1.25;
  knot.scale.set(1.3, 0.7, 1.3);
  balloon.add(knot);

  // ======== ENVIRONMENT MAP ========
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0xFFF0F5);
  const envLight1 = new THREE.DirectionalLight(0xFFFFFF, 2);
  envLight1.position.set(5, 10, 7);
  envScene.add(envLight1);
  const envLight2 = new THREE.DirectionalLight(0xFFE0F0, 1.5);
  envLight2.position.set(-5, 5, -3);
  envScene.add(envLight2);
  scene.environment = pmremGenerator.fromScene(envScene, 0.04).texture;

  // ======== GROUND SHADOW ========
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.15 }));
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -3.5;
  plane.receiveShadow = true;
  scene.add(plane);

  // ======== BALLOON FRAGMENTS ========
  const fragmentCount = 25;
  const fragments = [];
  const fragGroup = new THREE.Group();
  fragGroup.visible = false;
  scene.add(fragGroup);

  const fragColors = [0xFF3366, 0xFF1744, 0xFF5252, 0xFF80AB, 0xF50057, 0xCC1144, 0xE91E63];

  for (let i = 0; i < fragmentCount; i++) {
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array([
      0, 0, 0,
      (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.1,
      0, 0, 0,
      (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.1
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshPhysicalMaterial({
      color: fragColors[Math.floor(Math.random() * fragColors.length)],
      roughness: 0.3,
      metalness: 0.0,
      clearcoat: 0.8,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    fragGroup.add(mesh);
    fragments.push({
      mesh,
      vel: new THREE.Vector3(),
      rotVel: new THREE.Vector3(),
      life: 0
    });
  }

  function explodeFragments(origin) {
    fragGroup.visible = true;
    for (const f of fragments) {
      f.mesh.visible = true;
      f.mesh.position.copy(origin);
      f.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 2 + Math.random() * 6;
      f.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.abs(Math.sin(phi) * Math.sin(theta)) * speed + 2,
        Math.cos(phi) * speed * 0.5
      );
      f.rotVel.set(
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15
      );
      f.life = 1.0;
      const s = 0.5 + Math.random() * 1.2;
      f.mesh.scale.set(s, s, s);
    }
  }

  function updateFragments(dt) {
    if (!fragGroup.visible) return;
    let alive = 0;
    for (const f of fragments) {
      if (f.life <= 0) { f.mesh.visible = false; continue; }
      alive++;
      f.vel.y -= 6.0 * dt;
      f.mesh.position.x += f.vel.x * dt;
      f.mesh.position.y += f.vel.y * dt;
      f.mesh.position.z += f.vel.z * dt;
      f.mesh.rotation.x += f.rotVel.x * dt;
      f.mesh.rotation.y += f.rotVel.y * dt;
      f.mesh.rotation.z += f.rotVel.z * dt;
      f.life -= dt * 0.35;
    }
    if (alive === 0) fragGroup.visible = false;
  }

  // ======== INPUT (mouse fallback for desktop) ========
  document.addEventListener('mousemove', (e) => {
    if (!gameStarted || isExploded || gyroEnabled) return;
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -(e.clientY / window.innerHeight) * 2 + 1;
    physics.targetTiltZ = nx * physics.maxTilt;
    physics.targetTiltX = ny * physics.maxTilt * 0.5;
  });

  // ======== INFLATION ========
  function getInflationScale() {
    const progress = 1 - (timeLeft / totalTime);
    return 0.4 + 0.85 * progress;
  }

  function getBalloonColor() {
    const progress = 1 - (timeLeft / totalTime);
    const c1 = new THREE.Color(0xFF3366);
    const c2 = new THREE.Color(0xFF0000);
    const c3 = new THREE.Color(0x880000);
    return progress < 0.5
      ? c1.clone().lerp(c2, progress * 2)
      : c2.clone().lerp(c3, (progress - 0.5) * 2);
  }

  // ======== TIMER ========
  let lastTime = performance.now();
  let timerAccum = 0;

  function updateTimer(dt) {
    if (isExploded) return;
    timerAccum += dt;
    if (timerAccum >= 1.0) {
      timerAccum -= 1.0;
      timeLeft = Math.max(0, timeLeft - 1);
      if (timeLeft <= 0) explodeBalloon();
    }
  }

  // ======== GAME FLOW ========
  function startCountdown() {
    splash.classList.remove('active');
    countdownEl.classList.add('active');
    requestGyroPermission();
    let count = 3;
    countNum.textContent = count;
    const countLabel = document.querySelector('.count-label');
    countLabel.textContent = 'Preparate';

    function animateCount() {
      countNum.style.animation = 'none';
      countNum.offsetHeight;
      countNum.style.animation = 'countPop 0.6s cubic-bezier(0.22, 1, 0.36, 1)';

      const container = document.querySelector('.count-container');
      const oldRing = container.querySelector('.count-ring');
      if (oldRing) oldRing.remove();
      const ring = document.createElement('div');
      ring.className = 'count-ring';
      container.appendChild(ring);
    }

    animateCount();
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countNum.textContent = count;
        animateCount();
      } else if (count === 0) {
        countNum.textContent = '¡YA!';
        countLabel.textContent = '';
        animateCount();
      } else {
        clearInterval(interval);
        countdownEl.classList.remove('active');
        startGame();
      }
    }, 1000);
  }

  function startGame() {
    totalTime = Math.floor(Math.random() * (MAX_TIME - MIN_TIME + 1)) + MIN_TIME;
    timeLeft = totalTime;
    isExploded = false;
    gameStarted = true;
    timerAccum = 0;

    balloon.visible = true;
    balloon.scale.set(0.4, 0.4, 0.4);
    balloonMat.color.set(0xFF3366);
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);

    physics.currentTiltX = 0;
    physics.currentTiltZ = 0;
    physics.velX = 0;
    physics.velZ = 0;

    showHapticOverlay();
    startAudioLoop();
  }

  function explodeBalloon() {
    if (isExploded) return;
    isExploded = true;
    gameStarted = false;
    stopAudioLoop();
    hideHapticOverlay();

    triggerExplosionHaptic();

    document.getElementById('flash').classList.add('bang');
    setTimeout(() => document.getElementById('flash').classList.remove('bang'), 150);

    balloon.visible = false;

    explodeFragments(balloon.position.clone());

    setTimeout(() => {
      resultTime.textContent = totalTime;
      resultText.textContent = 'El globo explotó';

      const rings = resultEl.querySelectorAll('.result-ring');
      rings.forEach(r => {
        r.style.animation = 'none';
        r.offsetHeight;
        r.style.animation = '';
      });

      resultEl.classList.add('active');
    }, 800);
  }

  function resetGame() {
    isExploded = false;
    gameStarted = false;
    timerAccum = 0;
    stopAudioLoop();
    hideHapticOverlay();
    balloon.visible = false;
    fragGroup.visible = false;
    for (const f of fragments) f.mesh.visible = false;
    physics.currentTiltX = physics.currentTiltZ = physics.velX = physics.velZ = 0;
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);
    resultEl.classList.remove('active');
    splash.classList.add('active');
  }

  startBtn.addEventListener('click', startCountdown);
  restartBtn.addEventListener('click', resetGame);

  // ======== ANIMATION LOOP ========
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (gameStarted && !isExploded) {
      updateTimer(dt);

      const scale = getInflationScale();
      balloon.scale.set(scale, scale, scale);
      balloonMat.color.copy(getBalloonColor());

      physics.velX += (physics.targetTiltX - physics.currentTiltX) * physics.spring;
      physics.velZ += (physics.targetTiltZ - physics.currentTiltZ) * physics.spring;
      physics.velX *= physics.damping;
      physics.velZ *= physics.damping;
      physics.currentTiltX += physics.velX;
      physics.currentTiltZ += physics.velZ;

      balloon.rotation.x = physics.currentTiltX;
      balloon.rotation.z = physics.currentTiltZ;

      physics.floatPhase += dt * physics.floatSpeed;
      balloon.position.y = physics.baseY + Math.sin(physics.floatPhase) * physics.floatAmp;
      balloon.position.x = physics.currentTiltZ * 0.5;
      balloon.position.z = -physics.currentTiltX * 0.3;

      const stretch = 1 + (scale - 0.4) * 0.03;
      const squash = 1 - (scale - 0.4) * 0.02;
      balloon.scale.y *= stretch;
      balloon.scale.x *= squash;
      balloon.scale.z *= squash;

      const progress = 1 - (timeLeft / totalTime);
      if (progress > 0.75) {
        const wobble = (progress - 0.75) / 0.25;
        balloon.rotation.x += Math.sin(now * 0.02) * wobble * 0.08;
        balloon.rotation.z += Math.cos(now * 0.015) * wobble * 0.08;
      }
    }

    updateFragments(dt);
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
