<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎈 CUMPLE POP</title>
  <style>
    @font-face {
      font-family: 'UnicornPop';
      src: url('fonts/unicorn-pop.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(160deg, #FFF0F5 0%, #F3E5F5 40%, #FFF8E1 100%);
      font-family: 'UnicornPop', 'Segoe UI', system-ui, sans-serif;
    }
    #canvas-container {
      width: 100%; height: 100%;
      position: relative;
    }
    canvas { display: block; position: relative; z-index: 5; }

    /* Scrapbook decorations */
    .deco {
      position: absolute;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .deco-flower { font-size: 2.5rem; opacity: 0.45; }
    .f1 { top: 5%; left: 5%; transform: rotate(-15deg); }
    .f2 { top: 8%; right: 8%; transform: rotate(20deg); }
    .f3 { bottom: 10%; left: 7%; transform: rotate(10deg); }
    .f4 { bottom: 8%; right: 5%; transform: rotate(-25deg); }
    .f5 { top: 45%; left: 2%; transform: rotate(5deg); }
    .f6 { top: 50%; right: 3%; transform: rotate(-10deg); }

    .washi-tape {
      position: absolute;
      height: 28px;
      opacity: 0.65;
      z-index: 1;
      pointer-events: none;
    }
    .wt1 { top: -6px; left: 8%; width: 100px; transform: rotate(-8deg); background: repeating-linear-gradient(90deg, #FFB6C1, #FFB6C1 6px, transparent 6px, transparent 12px); }
    .wt2 { top: -4px; right: 10%; width: 90px; transform: rotate(6deg); background: repeating-linear-gradient(90deg, #B0E0E6, #B0E0E6 6px, transparent 6px, transparent 12px); }
    .wt3 { bottom: -6px; left: 15%; width: 110px; transform: rotate(4deg); background: repeating-linear-gradient(90deg, #DDA0DD, #DDA0DD 6px, transparent 6px, transparent 12px); }
    .wt4 { bottom: -4px; right: 12%; width: 95px; transform: rotate(-5deg); background: repeating-linear-gradient(90deg, #98FB98, #98FB98 6px, transparent 6px, transparent 12px); }

    /* Screens */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
    }
    .screen.active {
      opacity: 1;
      visibility: visible;
    }

    /* Splash screen */
    #splash {
      background: rgba(255,240,245,0.92);
    }
    #splash h2 {
      font-size: 3rem;
      color: #E91E63;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0 #F8BBD0;
    }
    #splash p {
      font-size: 1.1rem;
      color: #666;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: center;
    }
    .btn-action {
      background: linear-gradient(135deg, #FF69B4, #E91E63);
      color: #FFF;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'UnicornPop', inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(233,30,99,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:active { transform: scale(0.95); }

    /* Countdown overlay */
    #countdown {
      background: rgba(255,240,245,0.85);
      pointer-events: none;
    }
    #countdown .count-num {
      font-size: 8rem;
      font-weight: 900;
      color: #E91E63;
      text-shadow: 4px 4px 0 #F8BBD0;
      animation: countPulse 0.5s ease-out;
    }
    @keyframes countPulse {
      0% { transform: scale(1.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Result screen */
    #result {
      background: rgba(255,240,245,0.92);
    }
    #result h2 {
      font-size: 2.5rem;
      color: #E91E63;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #F8BBD0;
    }
    #result .result-emoji {
      font-size: 5rem;
      margin-bottom: 16px;
    }
    #result p {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 24px;
    }

    /* Explosion flash */
    .flash {
      position: absolute;
      inset: 0;
      background: #FFF;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.1s;
    }
    .flash.bang { opacity: 0.6; }

    /* Hide UI on mobile during game */
    @media (max-width: 768px) {
      .ui-layer { display: none !important; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "web-haptics": "https://esm.sh/web-haptics?bundle"
    }
  }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="canvas-container">
  <div class="washi-tape wt1"></div>
  <div class="washi-tape wt2"></div>
  <div class="washi-tape wt3"></div>
  <div class="washi-tape wt4"></div>

  <div class="deco deco-flower f1">🌸</div>
  <div class="deco deco-flower f2">🌼</div>
  <div class="deco deco-flower f3">🌷</div>
  <div class="deco deco-flower f4">🌺</div>
  <div class="deco deco-flower f5">💐</div>
  <div class="deco deco-flower f6">🌻</div>

  <div class="flash" id="flash"></div>

  <!-- Splash Screen -->
  <div class="screen active" id="splash">
    <h2>🎈 CUMPLE POP</h2>
    <p>Toca la pantalla para mover el globo. ¡No dejes que explote!</p>
    <button class="btn-action" id="startBtn">JUGAR</button>
  </div>

  <!-- Countdown Overlay -->
  <div class="screen" id="countdown">
    <div class="count-num" id="countNum">3</div>
  </div>

  <!-- Result Screen -->
  <div class="screen" id="result">
    <div class="result-emoji">💥</div>
    <h2>¡BOOM!</h2>
    <p id="resultText">El globo explotó</p>
    <button class="btn-action" id="restartBtn">JUGAR DE NUEVO</button>
  </div>
</div>

<script type="module">
import { WebHaptics } from 'web-haptics';
(function() {
  // ======== STATE ========
  const MIN_TIME = 50;
  const MAX_TIME = 140;
  let totalTime = 100;
  let timeLeft = totalTime;
  let isExploded = false;
  let gameStarted = false;
  const isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent);

  // Physics state
  const physics = {
    targetTiltX: 0,
    targetTiltZ: 0,
    currentTiltX: 0,
    currentTiltZ: 0,
    floatPhase: 0,
    floatSpeed: 1.2,
    floatAmp: 0.15,
    baseY: 0,
    velX: 0,
    velZ: 0,
    damping: 0.92,
    spring: 0.04,
    maxTilt: 0.6
  };

  // ======== DOM ========
  const splash = document.getElementById('splash');
  const countdownEl = document.getElementById('countdown');
  const countNum = document.getElementById('countNum');
  const resultEl = document.getElementById('result');
  const resultText = document.getElementById('resultText');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');

  // ======== HAPTICS ========
  const haptics = new WebHaptics({ debug: false });
  let hapticInterval = null;

  function getHapticPattern(progress) {
    if (progress < 0.5) {
      const intensity = 0.1 + progress * 0.4;
      return [{ duration: 20, intensity }];
    } else if (progress < 0.8) {
      const intensity = 0.3 + (progress - 0.5) * 1.5;
      return [{ duration: 30, intensity }, { delay: 20, duration: 20, intensity: intensity * 0.6 }];
    } else {
      return [
        { duration: 40, intensity: 0.9 },
        { delay: 15, duration: 30, intensity: 1 },
        { delay: 15, duration: 40, intensity: 0.8 }
      ];
    }
  }

  function startHapticLoop() {
    if (hapticInterval) clearInterval(hapticInterval);
    hapticInterval = setInterval(() => {
      if (!gameStarted || isExploded) return;
      const progress = 1 - (timeLeft / totalTime);
      haptics.trigger(getHapticPattern(progress));
    }, 500);
  }

  function stopHapticLoop() {
    if (hapticInterval) { clearInterval(hapticInterval); hapticInterval = null; }
  }

  function triggerExplosionHaptic() {
    haptics.trigger([
      { duration: 80, intensity: 1 },
      { delay: 30, duration: 60, intensity: 1 },
      { delay: 20, duration: 40, intensity: 1 },
      { delay: 15, duration: 30, intensity: 1 },
      { delay: 10, duration: 20, intensity: 1 },
      { delay: 10, duration: 15, intensity: 0.8 }
    ]);
  }

  // ======== THREE.JS SETUP ========
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xFFF5F8, 0.02);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.3, 4.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.insertBefore(renderer.domElement, container.firstChild);

  // ======== LIGHTING ========
  scene.add(new THREE.AmbientLight(0xFFE4EC, 0.6));

  const keyLight = new THREE.DirectionalLight(0xFFF0E0, 2.0);
  keyLight.position.set(3, 5, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.001;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xE0F0FF, 0.8);
  fillLight.position.set(-4, 2, 3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
  rimLight.position.set(0, 3, -5);
  scene.add(rimLight);

  const pointLight = new THREE.PointLight(0xFF80AB, 1.5, 10);
  pointLight.position.set(-1.5, 1, 2);
  scene.add(pointLight);

  // ======== BALLOON MATERIAL (PBR) ========
  const balloonGeo = new THREE.SphereGeometry(1, 128, 128);
  const balloonMat = new THREE.MeshPhysicalMaterial({
    color: 0xFF3366,
    roughness: 0.18,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    sheen: 1.0,
    sheenRoughness: 0.3,
    sheenColor: new THREE.Color(0xFF80AB),
    transmission: 0.08,
    thickness: 0.5,
    ior: 1.45,
    specularIntensity: 1.2,
    envMapIntensity: 1.0,
    side: THREE.DoubleSide
  });

  const balloon = new THREE.Mesh(balloonGeo, balloonMat);
  balloon.castShadow = true;
  balloon.receiveShadow = true;
  balloon.visible = false;
  scene.add(balloon);

  // ======== BALLOON NECK & KNOT ========
  const neckMat = new THREE.MeshPhysicalMaterial({ color: 0xCC1144, roughness: 0.25, clearcoat: 0.8, clearcoatRoughness: 0.15 });
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.35, 32), neckMat);
  neck.position.y = -1.05;
  neck.castShadow = true;
  balloon.add(neck);

  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), neckMat);
  knot.position.y = -1.25;
  knot.scale.set(1.3, 0.7, 1.3);
  balloon.add(knot);

  // ======== STRING ========
  let stringLine = null;
  function updateString() {
    if (stringLine) { balloon.remove(stringLine); stringLine.geometry.dispose(); }
    const knotWorld = new THREE.Vector3(0, -1.3, 0).applyMatrix4(balloon.matrixWorld);
    const points = [];
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      points.push(new THREE.Vector3(
        knotWorld.x * (1 - t * 0.3) + Math.sin(t * 3 + Date.now() * 0.002) * 0.05 * t,
        knotWorld.y - t * 2.5,
        knotWorld.z * (1 - t * 0.3) + Math.cos(t * 2.5 + Date.now() * 0.0015) * 0.05 * t
      ));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    stringLine = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 32, 0.012, 8, false),
      new THREE.MeshPhysicalMaterial({ color: 0xDDDDDD, roughness: 0.4, metalness: 0.1, clearcoat: 0.3 })
    );
    scene.add(stringLine);
  }

  // ======== ENVIRONMENT MAP ========
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0xFFF0F5);
  const envLight1 = new THREE.DirectionalLight(0xFFFFFF, 2);
  envLight1.position.set(5, 10, 7);
  envScene.add(envLight1);
  const envLight2 = new THREE.DirectionalLight(0xFFE0F0, 1.5);
  envLight2.position.set(-5, 5, -3);
  envScene.add(envLight2);
  scene.environment = pmremGenerator.fromScene(envScene, 0.04).texture;

  // ======== GROUND SHADOW ========
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.15 }));
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -3.5;
  plane.receiveShadow = true;
  scene.add(plane);

  // ======== BALLOON FRAGMENTS ========
  const fragmentCount = 25;
  const fragments = [];
  const fragGroup = new THREE.Group();
  fragGroup.visible = false;
  scene.add(fragGroup);

  const fragColors = [0xFF3366, 0xFF1744, 0xFF5252, 0xFF80AB, 0xF50057, 0xCC1144, 0xE91E63];

  for (let i = 0; i < fragmentCount; i++) {
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array([
      0, 0, 0,
      (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.25, (Math.random() - 0.5) * 0.1,
      0, 0, 0,
      (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.35, (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.28, (Math.random() - 0.5) * 0.1
    ]);
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.computeVertexNormals();

    const mat = new THREE.MeshPhysicalMaterial({
      color: fragColors[Math.floor(Math.random() * fragColors.length)],
      roughness: 0.3,
      metalness: 0.0,
      clearcoat: 0.8,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    fragGroup.add(mesh);
    fragments.push({
      mesh,
      vel: new THREE.Vector3(),
      rotVel: new THREE.Vector3(),
      life: 0
    });
  }

  function explodeFragments(origin) {
    fragGroup.visible = true;
    for (const f of fragments) {
      f.mesh.visible = true;
      f.mesh.position.copy(origin);
      f.mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 2 + Math.random() * 6;
      f.vel.set(
        Math.sin(phi) * Math.cos(theta) * speed,
        Math.abs(Math.sin(phi) * Math.sin(theta)) * speed + 2,
        Math.cos(phi) * speed * 0.5
      );
      f.rotVel.set(
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15,
        (Math.random() - 0.5) * 15
      );
      f.life = 1.0;
      const s = 0.5 + Math.random() * 1.2;
      f.mesh.scale.set(s, s, s);
    }
  }

  function updateFragments(dt) {
    if (!fragGroup.visible) return;
    let alive = 0;
    for (const f of fragments) {
      if (f.life <= 0) { f.mesh.visible = false; continue; }
      alive++;
      f.vel.y -= 6.0 * dt;
      f.mesh.position.x += f.vel.x * dt;
      f.mesh.position.y += f.vel.y * dt;
      f.mesh.position.z += f.vel.z * dt;
      f.mesh.rotation.x += f.rotVel.x * dt;
      f.mesh.rotation.y += f.rotVel.y * dt;
      f.mesh.rotation.z += f.rotVel.z * dt;
      f.life -= dt * 0.35;
    }
    if (alive === 0) fragGroup.visible = false;
  }

  // ======== INPUT ========
  document.addEventListener('mousemove', (e) => {
    if (!gameStarted || isExploded) return;
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -(e.clientY / window.innerHeight) * 2 + 1;
    physics.targetTiltZ = nx * physics.maxTilt;
    physics.targetTiltX = ny * physics.maxTilt * 0.5;
  });



  // ======== INFLATION ========
  function getInflationScale() {
    const progress = 1 - (timeLeft / totalTime);
    return 0.4 + 0.85 * progress;
  }

  function getBalloonColor() {
    const progress = 1 - (timeLeft / totalTime);
    const c1 = new THREE.Color(0xFF3366);
    const c2 = new THREE.Color(0xFF0000);
    const c3 = new THREE.Color(0x880000);
    return progress < 0.5
      ? c1.clone().lerp(c2, progress * 2)
      : c2.clone().lerp(c3, (progress - 0.5) * 2);
  }

  // ======== TIMER ========
  let lastTime = performance.now();
  let timerAccum = 0;

  function updateTimer(dt) {
    if (isExploded) return;
    timerAccum += dt;
    if (timerAccum >= 1.0) {
      timerAccum -= 1.0;
      timeLeft = Math.max(0, timeLeft - 1);
      if (timeLeft <= 0) explodeBalloon();
    }
  }

  // ======== GAME FLOW ========
  function startCountdown() {
    splash.classList.remove('active');
    countdownEl.classList.add('active');
    let count = 3;
    countNum.textContent = count;
    const interval = setInterval(() => {
      count--;
      if (count > 0) {
        countNum.textContent = count;
        countNum.style.animation = 'none';
        countNum.offsetHeight;
        countNum.style.animation = 'countPulse 0.5s ease-out';
      } else if (count === 0) {
        countNum.textContent = '¡YA!';
        countNum.style.animation = 'none';
        countNum.offsetHeight;
        countNum.style.animation = 'countPulse 0.5s ease-out';
      } else {
        clearInterval(interval);
        countdownEl.classList.remove('active');
        startGame();
      }
    }, 1000);
  }

  function startGame() {
    totalTime = Math.floor(Math.random() * (MAX_TIME - MIN_TIME + 1)) + MIN_TIME;
    timeLeft = totalTime;
    isExploded = false;
    gameStarted = true;
    timerAccum = 0;

    balloon.visible = true;
    balloon.scale.set(0.4, 0.4, 0.4);
    balloonMat.color.set(0xFF3366);
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);

    physics.currentTiltX = 0;
    physics.currentTiltZ = 0;
    physics.velX = 0;
    physics.velZ = 0;

    startHapticLoop();
  }

  function explodeBalloon() {
    if (isExploded) return;
    isExploded = true;
    gameStarted = false;
    stopHapticLoop();

    triggerExplosionHaptic();

    document.getElementById('flash').classList.add('bang');
    setTimeout(() => document.getElementById('flash').classList.remove('bang'), 150);

    balloon.visible = false;
    if (stringLine) stringLine.visible = false;

    explodeFragments(balloon.position.clone());

    setTimeout(() => {
      resultText.textContent = `Aguantó ${totalTime} segundos`;
      resultEl.classList.add('active');
    }, 800);
  }

  function resetGame() {
    isExploded = false;
    gameStarted = false;
    timerAccum = 0;
    stopHapticLoop();
    haptics.cancel();
    balloon.visible = false;
    if (stringLine) stringLine.visible = true;
    fragGroup.visible = false;
    for (const f of fragments) f.mesh.visible = false;
    physics.currentTiltX = physics.currentTiltZ = physics.velX = physics.velZ = 0;
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);
    resultEl.classList.remove('active');
    splash.classList.add('active');
  }

  startBtn.addEventListener('click', startCountdown);
  restartBtn.addEventListener('click', resetGame);

  // ======== ANIMATION LOOP ========
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (gameStarted && !isExploded) {
      updateTimer(dt);

      const scale = getInflationScale();
      balloon.scale.set(scale, scale, scale);
      balloonMat.color.copy(getBalloonColor());

      physics.velX += (physics.targetTiltX - physics.currentTiltX) * physics.spring;
      physics.velZ += (physics.targetTiltZ - physics.currentTiltZ) * physics.spring;
      physics.velX *= physics.damping;
      physics.velZ *= physics.damping;
      physics.currentTiltX += physics.velX;
      physics.currentTiltZ += physics.velZ;

      balloon.rotation.x = physics.currentTiltX;
      balloon.rotation.z = physics.currentTiltZ;

      physics.floatPhase += dt * physics.floatSpeed;
      balloon.position.y = physics.baseY + Math.sin(physics.floatPhase) * physics.floatAmp;
      balloon.position.x = physics.currentTiltZ * 0.5;
      balloon.position.z = -physics.currentTiltX * 0.3;

      const stretch = 1 + (scale - 0.4) * 0.03;
      const squash = 1 - (scale - 0.4) * 0.02;
      balloon.scale.y *= stretch;
      balloon.scale.x *= squash;
      balloon.scale.z *= squash;

      const progress = 1 - (timeLeft / totalTime);
      if (progress > 0.75) {
        const wobble = (progress - 0.75) / 0.25;
        balloon.rotation.x += Math.sin(now * 0.02) * wobble * 0.08;
        balloon.rotation.z += Math.cos(now * 0.015) * wobble * 0.08;
      }

      updateString();
    }

    updateFragments(dt);
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
