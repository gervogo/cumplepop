<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CumplePop 🎈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/balloon.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/screens.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen" class="screen active">
    <div class="sticker sticker-flower">🌸</div>
    <div class="sticker sticker-heart">💖</div>
    <div class="sticker sticker-star">⭐</div>
    <div class="sticker sticker-balloon">🎈</div>
    
    <div class="splash-content">
      <h1 class="game-title">CumplePop</h1>
      <p class="subtitle">¡La patata más caliente!</p>
      
      <div class="splash-instructions">
        <p>Responde preguntas antes de que explote la patata 🥔</p>
        <p class="hint"> Usa las teclas 1-4 o haz clic para responder</p>
      </div>
      
      <button id="btn-start" class="btn-primary btn-large">
        <span class="btn-icon">🎮</span>
        JUGAR
      </button>
    </div>
    
    <div class="splash-decoration">
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Header -->
    <div id="game-header">
      <div id="score-container">
        <span class="label">Puntos</span>
        <span id="score-display">0</span>
      </div>
      
      <div id="question-progress">1 / 10</div>
      
      <div id="streak-container">
        <span id="streak-display"></span>
      </div>
    </div>
    
    <!-- Timer -->
    <div id="timer-container">
      <div id="timer-fill"></div>
      <span id="timer-text">60s</span>
    </div>
    
    <!-- Countdown overlay -->
    <div id="countdown" class="countdown-overlay">3</div>
    
    <!-- 3D Canvas -->
    <canvas id="balloon-canvas"></canvas>
    
    <!-- Answer feedback -->
    <div id="answer-feedback" class="answer-feedback"></div>
    
    <!-- Question container -->
    <div id="question-container" class="hidden">
      <div class="card-question">
        <p id="question-text"></p>
        <div id="options-grid"></div>
      </div>
      <button id="btn-validate" class="btn-primary" disabled>
        VALIDAR
      </button>
    </div>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <div class="sticker sticker-confetti">🎉</div>
    <div class="sticker sticker-confetti-2">🎊</div>
    
    <div class="result-content">
      <h2 id="result-title"></h2>
      <p id="result-subtitle"></p>
      <p id="result-score" class="final-score"></p>
      
      <div id="game-stats" class="stats-container"></div>
      
      <button id="btn-restart" class="btn-primary btn-large">
        <span class="btn-icon">🔄</span>
        JUGAR DE NUEVO
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
