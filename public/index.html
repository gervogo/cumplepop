<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CumplePop 🎈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/balloon.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/screens.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen" class="screen active">
    <!-- Washi Tape Decorations -->
    <div class="washi-tape washi-tape-top-left"></div>
    <div class="washi-tape washi-tape-top-right"></div>
    <div class="washi-tape washi-tape-bottom-left"></div>
    <div class="washi-tape washi-tape-bottom-right"></div>
    
    <!-- Stickers -->
    <div class="sticker sticker-flower">🌸</div>
    <div class="sticker sticker-heart">💖</div>
    <div class="sticker sticker-star">⭐</div>
    <div class="sticker sticker-balloon">🎈</div>
    
    <div class="splash-content">
      <h1 class="game-title">CumplePop</h1>
      <p class="subtitle">¡La patata más caliente!</p>
      
      <div class="splash-instructions">
        <p>¡Sostén la patata antes de que explote! 🥔</p>
        <p class="hint">No la sueltes...</p>
      </div>
      
      <button id="btn-start" class="btn-primary btn-large">
        <span class="btn-icon">🎮</span>
        JUGAR
      </button>
    </div>
    
    <div class="splash-decoration">
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
      <div class="deco-circle"></div>
    </div>
  </div>

  <!-- Game Screen -->
  <div id="game-screen" class="screen">
    <!-- Countdown overlay -->
    <div id="countdown" class="countdown-overlay">3</div>
    
    <!-- 3D Canvas - The Potato/Balloon -->
    <canvas id="balloon-canvas"></canvas>
  </div>

  <!-- Result Screen -->
  <div id="result-screen" class="screen">
    <!-- Washi Tape -->
    <div class="washi-tape washi-tape-top-left"></div>
    <div class="washi-tape washi-tape-top-right"></div>
    
    <!-- Stickers -->
    <div class="sticker sticker-confetti">🎉</div>
    <div class="sticker sticker-confetti-2">🎊</div>
    <div class="sticker" style="bottom: 20%; left: 10%; animation-delay: 0.3s;">🌸</div>
    <div class="sticker" style="bottom: 15%; right: 8%; animation-delay: 0.8s;">💖</div>
    
    <div class="result-content">
      <h2 id="result-title">¡BOOM! 💥</h2>
      <p id="result-subtitle">La patata ha explotado...</p>
      
      <button id="btn-restart" class="btn-primary btn-large btn-restart">
        <span class="btn-icon">🔄</span>
        JUGAR DE NUEVO
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
