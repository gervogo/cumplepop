<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎈 Globo Hiperrealista 3D — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #FFF0F5 0%, #F3E5F5 40%, #FFF8E1 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #canvas-container {
    width: 100%; height: 100%;
    position: relative;
  }
  canvas { display: block; }

  /* Scrapbook decorations */
  .deco {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 10;
  }
  .deco-flower { font-size: 2rem; opacity: 0.25; }
  .f1 { top: 5%; left: 5%; transform: rotate(-15deg); }
  .f2 { top: 8%; right: 8%; transform: rotate(20deg); }
  .f3 { bottom: 10%; left: 7%; transform: rotate(10deg); }
  .f4 { bottom: 8%; right: 5%; transform: rotate(-25deg); }
  .f5 { top: 45%; left: 2%; transform: rotate(5deg); }
  .f6 { top: 50%; right: 3%; transform: rotate(-10deg); }

  .washi-tape {
    position: absolute;
    height: 24px;
    opacity: 0.55;
    z-index: 10;
    pointer-events: none;
  }
  .wt1 { top: -6px; left: 8%; width: 90px; transform: rotate(-8deg); background: repeating-linear-gradient(90deg, #FFB6C1, #FFB6C1 6px, transparent 6px, transparent 12px); }
  .wt2 { top: -4px; right: 10%; width: 80px; transform: rotate(6deg); background: repeating-linear-gradient(90deg, #B0E0E6, #B0E0E6 6px, transparent 6px, transparent 12px); }
  .wt3 { bottom: -6px; left: 15%; width: 100px; transform: rotate(4deg); background: repeating-linear-gradient(90deg, #DDA0DD, #DDA0DD 6px, transparent 6px, transparent 12px); }
  .wt4 { bottom: -4px; right: 12%; width: 85px; transform: rotate(-5deg); background: repeating-linear-gradient(90deg, #98FB98, #98FB98 6px, transparent 6px, transparent 12px); }

  /* UI overlay */
  .ui-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 20;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .title-box {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border-radius: 16px;
    padding: 12px 20px;
    border: 2px dashed #E91E63;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .title-box h1 {
    font-size: 1.4rem;
    color: #E91E63;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 #F8BBD0;
  }
  .title-box p {
    font-size: 0.75rem;
    color: #888;
    margin-top: 2px;
  }

  .gyro-badge {
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.75rem;
    color: #666;
    border: 1.5px dashed #CE93D8;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gyro-badge.active { color: #2E7D32; border-color: #81C784; }
  .gyro-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ccc;
  }
  .gyro-badge.active .gyro-dot { background: #4CAF50; box-shadow: 0 0 6px #4CAF50; }

  .bottom-bar {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pill {
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #555;
    border: 2px solid #F8BBD0;
    pointer-events: auto;
  }
  .pill span { color: #E91E63; font-size: 1.05rem; }

  .btn-action {
    pointer-events: auto;
    background: linear-gradient(135deg, #FF69B4, #E91E63);
    color: #FFF;
    border: none;
    border-radius: 14px;
    padding: 12px 24px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(233,30,99,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-action:active { transform: scale(0.95); }
  .btn-action:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Permission overlay for iOS */
  .perm-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,240,245,0.92);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    pointer-events: auto;
  }
  .perm-overlay.hidden { display: none; }
  .perm-overlay h2 {
    font-size: 2rem;
    color: #E91E63;
    margin-bottom: 12px;
    text-shadow: 2px 2px 0 #F8BBD0;
  }
  .perm-overlay p {
    font-size: 1rem;
    color: #666;
    max-width: 320px;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .perm-btn {
    background: linear-gradient(135deg, #FF69B4, #E91E63);
    color: #FFF;
    border: none;
    border-radius: 16px;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(233,30,99,0.35);
  }

  /* Explosion flash */
  .flash {
    position: absolute;
    inset: 0;
    background: #FFF;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.1s;
  }
  .flash.bang { opacity: 0.6; }
</style>
<!-- Three.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="canvas-container">
  <div class="washi-tape wt1"></div>
  <div class="washi-tape wt2"></div>
  <div class="washi-tape wt3"></div>
  <div class="washi-tape wt4"></div>

  <div class="deco deco-flower f1">🌸</div>
  <div class="deco deco-flower f2">🌼</div>
  <div class="deco deco-flower f3">🌷</div>
  <div class="deco deco-flower f4">🌺</div>
  <div class="deco deco-flower f5">💐</div>
  <div class="deco deco-flower f6">🌻</div>

  <div class="flash" id="flash"></div>

  <div class="perm-overlay" id="permOverlay">
    <h2>🎈 CUMPLE POP</h2>
    <p>Para mover el globo con el giroscopio de tu móvil, necesitamos acceso a la orientación del dispositivo.</p>
    <button class="perm-btn" id="permBtn">📱 Activar giroscopio</button>
    <p style="margin-top:16px; font-size:0.8rem; color:#999;">En ordenador, mueve el ratón para inclinar el globo.</p>
  </div>

  <div class="ui-layer">
    <div class="top-bar">
      <div class="title-box">
        <h1>🎈 CUMPLE POP</h1>
        <p>Demo del globo hiperrealista</p>
      </div>
      <div class="gyro-badge" id="gyroBadge">
        <div class="gyro-dot"></div>
        <span id="gyroText">Esperando sensor…</span>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="pill">⏱️ <span id="timeVal">120</span>s</div>
      <div class="pill">📏 <span id="sizeVal">35</span>%</div>
      <button class="btn-action" id="restartBtn">🔄 Reiniciar</button>
    </div>
  </div>
</div>

<script>
(function() {
  // ======== STATE ========
  const TOTAL_TIME = 120; // seconds for demo
  let timeLeft = TOTAL_TIME;
  let isExploded = false;
  let gyroActive = false;
  let mouseMode = false;

  // Physics state
  const physics = {
    targetTiltX: 0,  // target tilt from gyro/mouse
    targetTiltZ: 0,
    currentTiltX: 0,
    currentTiltZ: 0,
    floatPhase: 0,
    floatSpeed: 1.2,
    floatAmp: 0.15,
    baseY: 0,
    velX: 0,
    velZ: 0,
    damping: 0.92,
    spring: 0.04,
    maxTilt: 0.6
  };

  // ======== THREE.JS SETUP ========
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  // Soft fog for depth
  scene.fog = new THREE.FogExp2(0xFFF5F8, 0.02);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.5, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.insertBefore(renderer.domElement, container.firstChild);

  // ======== LIGHTING ========
  // Ambient
  const ambientLight = new THREE.AmbientLight(0xFFE4EC, 0.6);
  scene.add(ambientLight);

  // Key light (warm, from top-right)
  const keyLight = new THREE.DirectionalLight(0xFFF0E0, 2.0);
  keyLight.position.set(3, 5, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.001;
  keyLight.shadow.radius = 4;
  scene.add(keyLight);

  // Fill light (cool, from left)
  const fillLight = new THREE.DirectionalLight(0xE0F0FF, 0.8);
  fillLight.position.set(-4, 2, 3);
  scene.add(fillLight);

  // Rim light (back, for edge definition)
  const rimLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
  rimLight.position.set(0, 3, -5);
  scene.add(rimLight);

  // Point light near balloon for local specular
  const pointLight = new THREE.PointLight(0xFF80AB, 1.5, 10);
  pointLight.position.set(-1.5, 1, 2);
  scene.add(pointLight);

  // ======== BALLOON MATERIAL (PBR) ========
  // High-res sphere for smooth silhouette
  const balloonGeo = new THREE.SphereGeometry(1, 128, 128);

  const balloonMat = new THREE.MeshPhysicalMaterial({
    color: 0xFF3366,
    roughness: 0.18,
    metalness: 0.0,
    clearcoat: 1.0,
    clearcoatRoughness: 0.08,
    sheen: 1.0,
    sheenRoughness: 0.3,
    sheenColor: new THREE.Color(0xFF80AB),
    transmission: 0.08,
    thickness: 0.5,
    ior: 1.45,
    specularIntensity: 1.2,
    envMapIntensity: 1.0,
    side: THREE.DoubleSide
  });

  const balloon = new THREE.Mesh(balloonGeo, balloonMat);
  balloon.castShadow = true;
  balloon.receiveShadow = true;
  scene.add(balloon);

  // ======== BALLOON NECK & KNOT ========
  const neckGeo = new THREE.CylinderGeometry(0.12, 0.18, 0.35, 32);
  const neckMat = new THREE.MeshPhysicalMaterial({
    color: 0xCC1144,
    roughness: 0.25,
    clearcoat: 0.8,
    clearcoatRoughness: 0.15
  });
  const neck = new THREE.Mesh(neckGeo, neckMat);
  neck.position.y = -1.05;
  neck.castShadow = true;
  balloon.add(neck);

  const knotGeo = new THREE.SphereGeometry(0.1, 16, 16);
  const knot = new THREE.Mesh(knotGeo, neckMat);
  knot.position.y = -1.25;
  knot.scale.set(1.3, 0.7, 1.3);
  balloon.add(knot);

  // ======== STRING (Catmull-Rom curve) ========
  let stringLine = null;
  function updateString() {
    if (stringLine) { balloon.remove(stringLine); stringLine.geometry.dispose(); }
    const knotWorld = new THREE.Vector3(0, -1.3, 0);
    knotWorld.applyMatrix4(balloon.matrixWorld);

    // String dangles from knot to below
    const points = [];
    const segments = 20;
    const stringLen = 2.5;
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const x = knotWorld.x * (1 - t * 0.3) + Math.sin(t * 3 + Date.now() * 0.002) * 0.05 * t;
      const y = knotWorld.y - t * stringLen;
      const z = knotWorld.z * (1 - t * 0.3) + Math.cos(t * 2.5 + Date.now() * 0.0015) * 0.05 * t;
      points.push(new THREE.Vector3(x, y, z));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.012, 8, false);
    const tubeMat = new THREE.MeshPhysicalMaterial({
      color: 0xDDDDDD,
      roughness: 0.4,
      metalness: 0.1,
      clearcoat: 0.3
    });
    stringLine = new THREE.Mesh(tubeGeo, tubeMat);
    scene.add(stringLine);
  }

  // ======== ENVIRONMENT MAP (procedural) ========
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileEquirectangularShader();

  // Create a simple env scene
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0xFFF0F5);
  const envLight1 = new THREE.DirectionalLight(0xFFFFFF, 2);
  envLight1.position.set(5, 10, 7);
  envScene.add(envLight1);
  const envLight2 = new THREE.DirectionalLight(0xFFE0F0, 1.5);
  envLight2.position.set(-5, 5, -3);
  envScene.add(envLight2);
  const envEnvMap = pmremGenerator.fromScene(envScene, 0.04).texture;
  scene.environment = envEnvMap;

  // ======== GROUND SHADOW PLANE ========
  const planeGeo = new THREE.PlaneGeometry(20, 20);
  const planeMat = new THREE.ShadowMaterial({ opacity: 0.15 });
  const plane = new THREE.Mesh(planeGeo, planeMat);
  plane.rotation.x = -Math.PI / 2;
  plane.position.y = -3.5;
  plane.receiveShadow = true;
  scene.add(plane);

  // ======== PARTICLES SYSTEM (for explosion) ========
  const particleCount = 300;
  const particleGeo = new THREE.BufferGeometry();
  const pPositions = new Float32Array(particleCount * 3);
  const pVelocities = [];
  const pColors = new Float32Array(particleCount * 3);
  const pSizes = new Float32Array(particleCount);
  const pLife = new Float32Array(particleCount);

  const palette = [
    new THREE.Color(0xFF1744),
    new THREE.Color(0xFF5252),
    new THREE.Color(0xFF80AB),
    new THREE.Color(0xF50057),
    new THREE.Color(0xFFEB3B),
    new THREE.Color(0xFFFFFF),
    new THREE.Color(0xE91E63)
  ];

  for (let i = 0; i < particleCount; i++) {
    pPositions[i*3] = 0; pPositions[i*3+1] = 0; pPositions[i*3+2] = 0;
    pVelocities.push({ x:0, y:0, z:0 });
    const c = palette[Math.floor(Math.random() * palette.length)];
    pColors[i*3] = c.r; pColors[i*3+1] = c.g; pColors[i*3+2] = c.b;
    pSizes[i] = 0;
    pLife[i] = 0;
  }
  particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
  particleGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
  particleGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

  const particleMat = new THREE.PointsMaterial({
    size: 0.08,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const particles = new THREE.Points(particleGeo, particleMat);
  particles.visible = false;
  scene.add(particles);

  function explodeParticles(origin) {
    particles.visible = true;
    const pos = particleGeo.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      pos[i*3] = origin.x; pos[i*3+1] = origin.y; pos[i*3+2] = origin.z;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = 1.5 + Math.random() * 5;
      pVelocities[i].x = Math.sin(phi) * Math.cos(theta) * speed;
      pVelocities[i].y = Math.sin(phi) * Math.sin(theta) * speed;
      pVelocities[i].z = Math.cos(phi) * speed;
      pLife[i] = 1.0;
      pSizes[i] = 0.5 + Math.random() * 1.5;
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.size.needsUpdate = true;
  }

  function updateParticles(dt) {
    if (!particles.visible) return;
    const pos = particleGeo.attributes.position.array;
    let alive = 0;
    for (let i = 0; i < particleCount; i++) {
      if (pLife[i] <= 0) continue;
      alive++;
      pVelocities[i].y -= 3.0 * dt; // gravity
      pVelocities[i].x *= 0.985;
      pVelocities[i].z *= 0.985;
      pos[i*3] += pVelocities[i].x * dt;
      pos[i*3+1] += pVelocities[i].y * dt;
      pos[i*3+2] += pVelocities[i].z * dt;
      pLife[i] -= dt * (0.4 + Math.random() * 0.3);
      pSizes[i] *= 0.995;
    }
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.size.needsUpdate = true;
    if (alive === 0) particles.visible = false;
  }

  // ======== GYROSCOPE ========
  const gyroBadge = document.getElementById('gyroBadge');
  const gyroText = document.getElementById('gyroText');
  const permOverlay = document.getElementById('permOverlay');
  const permBtn = document.getElementById('permBtn');

  function handleOrientation(e) {
    if (!gyroActive) return;
    // beta: front-back (-180 to 180), gamma: left-right (-90 to 90)
    const beta = THREE.MathUtils.clamp(e.beta || 0, -45, 45);
    const gamma = THREE.MathUtils.clamp(e.gamma || 0, -45, 45);
    physics.targetTiltX = (beta / 45) * physics.maxTilt;
    physics.targetTiltZ = (gamma / 45) * physics.maxTilt;
  }

  function requestGyro() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          gyroActive = true;
          window.addEventListener('deviceorientation', handleOrientation);
          permOverlay.classList.add('hidden');
          gyroBadge.classList.add('active');
          gyroText.textContent = 'Giroscopio activo';
        } else {
          gyroText.textContent = 'Permiso denegado';
        }
      }).catch(() => {
        gyroText.textContent = 'Error de sensor';
      });
    } else {
      gyroActive = true;
      window.addEventListener('deviceorientation', handleOrientation);
      permOverlay.classList.add('hidden');
      gyroBadge.classList.add('active');
      gyroText.textContent = 'Giroscopio activo';
    }
  }

  permBtn.addEventListener('click', requestGyro);

  // Auto-request on non-iOS after a moment
  setTimeout(() => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      requestGyro();
    }
  }, 500);

  // ======== MOUSE FALLBACK ========
  document.addEventListener('mousemove', (e) => {
    if (gyroActive) return;
    mouseMode = true;
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -(e.clientY / window.innerHeight) * 2 + 1;
    physics.targetTiltZ = nx * physics.maxTilt;
    physics.targetTiltX = ny * physics.maxTilt * 0.5;
    gyroBadge.classList.add('active');
    gyroText.textContent = 'Modo ratón activo';
  });

  // ======== INFLATION LOGIC ========
  function getInflationScale() {
    const progress = 1 - (timeLeft / TOTAL_TIME);
    const base = 0.35;
    const max = 1.15;
    return base + (max - base) * progress;
  }

  function getBalloonColor() {
    const progress = 1 - (timeLeft / TOTAL_TIME);
    const c1 = new THREE.Color(0xFF3366); // pink
    const c2 = new THREE.Color(0xFF0000); // red
    const c3 = new THREE.Color(0x880000); // dark red
    if (progress < 0.5) {
      return c1.clone().lerp(c2, progress * 2);
    } else {
      return c2.clone().lerp(c3, (progress - 0.5) * 2);
    }
  }

  // ======== TIMER ========
  const timeVal = document.getElementById('timeVal');
  const sizeVal = document.getElementById('sizeVal');
  let lastTime = performance.now();
  let timerAccum = 0;

  function updateTimer(dt) {
    if (isExploded) return;
    timerAccum += dt;
    if (timerAccum >= 1.0) {
      timerAccum -= 1.0;
      timeLeft = Math.max(0, timeLeft - 1);
      timeVal.textContent = timeLeft;
      const pct = Math.round((1 - timeLeft / TOTAL_TIME) * 100);
      sizeVal.textContent = pct;

      if (timeLeft <= 0) {
        explodeBalloon();
      }
    }
  }

  function explodeBalloon() {
    if (isExploded) return;
    isExploded = true;

    // Flash
    const flash = document.getElementById('flash');
    flash.classList.add('bang');
    setTimeout(() => flash.classList.remove('bang'), 150);

    // Hide balloon
    balloon.visible = false;
    if (stringLine) stringLine.visible = false;

    // Particles
    const origin = balloon.position.clone();
    explodeParticles(origin);

    // UI
    timeVal.textContent = '0';
    sizeVal.textContent = '100';
    gyroText.textContent = '💥 ¡BOOM!';
  }

  // ======== RESTART ========
  document.getElementById('restartBtn').addEventListener('click', () => {
    isExploded = false;
    timeLeft = TOTAL_TIME;
    timerAccum = 0;
    balloon.visible = true;
    if (stringLine) { stringLine.visible = true; }
    particles.visible = false;
    timeVal.textContent = TOTAL_TIME;
    sizeVal.textContent = '0';
    physics.currentTiltX = 0;
    physics.currentTiltZ = 0;
    physics.velX = 0;
    physics.velZ = 0;
    balloon.rotation.set(0, 0, 0);
    balloon.position.set(0, 0, 0);
  });

  // ======== ANIMATION LOOP ========
  function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (!isExploded) {
      updateTimer(dt);

      // Inflation
      const scale = getInflationScale();
      balloon.scale.set(scale, scale, scale);
      balloonMat.color.copy(getBalloonColor());

      // Physics: spring-damper toward target tilt
      const ax = (physics.targetTiltX - physics.currentTiltX) * physics.spring;
      const az = (physics.targetTiltZ - physics.currentTiltZ) * physics.spring;
      physics.velX += ax;
      physics.velZ += az;
      physics.velX *= physics.damping;
      physics.velZ *= physics.damping;
      physics.currentTiltX += physics.velX;
      physics.currentTiltZ += physics.velZ;

      // Apply tilt as rotation
      balloon.rotation.x = physics.currentTiltX;
      balloon.rotation.z = physics.currentTiltZ;

      // Floating (vertical bob)
      physics.floatPhase += dt * physics.floatSpeed;
      const floatY = Math.sin(physics.floatPhase) * physics.floatAmp;
      balloon.position.y = physics.baseY + floatY;

      // Slight drift from tilt
      balloon.position.x = physics.currentTiltZ * 0.5;
      balloon.position.z = -physics.currentTiltX * 0.3;

      // Subtle squash-stretch based on inflation
      const stretch = 1 + (scale - 0.35) * 0.03;
      const squash = 1 - (scale - 0.35) * 0.02;
      balloon.scale.y *= stretch;
      balloon.scale.x *= squash;
      balloon.scale.z *= squash;

      // Wobble when near explosion
      const progress = 1 - (timeLeft / TOTAL_TIME);
      if (progress > 0.75) {
        const wobble = (progress - 0.75) / 0.25;
        balloon.rotation.x += Math.sin(now * 0.02) * wobble * 0.08;
        balloon.rotation.z += Math.cos(now * 0.015) * wobble * 0.08;
      }

      updateString();
    }

    updateParticles(dt);
    renderer.render(scene, camera);
  }

  animate();

  // ======== RESIZE ========
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
</html>
